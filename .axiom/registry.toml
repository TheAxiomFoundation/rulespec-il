# App-surface visibility for this repository's encodings.
# Public on Max's call of 2026-09-07 ("similar treatment to Belgium"): the
# pilot is served and listed in the app like every other public family. It
# remains a bounded, uncertified pilot with no executable oracle wired; the
# app presents it, it does not certify it. The modules are validated against a
# signed corpus release, named in .axiom/toolchain.toml.
[registry]
app_visibility = "public"
