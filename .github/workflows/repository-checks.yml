name: Repository Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    uses: TheAxiomFoundation/.github/.github/workflows/validate-rulespec.yml@882c5f11545ec3343fc5ed170e01d65aa2c5bb3e
    secrets: inherit
    with:
      # axiom-encode main at 630aa73931e5aa87c51d25fe448e38dbcfaed50f (encoder 0.2.2180),
      # chosen as the pair rulespec-nz ran with shared workflow b36f534e. It reads corpus
      # checkouts that keep their bytes in lock files (axiom-corpus#774), which the
      # corpus ref below needs, and it contains axiom-encode #1744 (a Hebrew percent
      # heading over a pipe-table column).
      axiom-encode-ref: 630aa73931e5aa87c51d25fe448e38dbcfaed50f
      # Engine main at engine#270 (lifetime commencement, engine#260). It
      # contains the Israel ILS currency seed (engine#169) and dated
      # single-version rules (engine#130).
      axiom-rules-engine-ref: 363c6a6c56f7ad130996b63f7a09cfd4c3d9b021
      # axiom-corpus#767 as merged to main: the Israel scope il/statute @
      # 2026-09-29-il-taxben-contributions, published as release
      # il-rulespec-2026-09-29 (pinned in .axiom/toolchain.toml). The validator
      # requires this checkout to contain the release's provenance commit.
      axiom-corpus-ref: 6920fabd47f721ab2e18717bfb8fbb05d965be40
      rulespec-us-ref: 0f291b367bf7e15555f9973112278c5cbf221653
      validate-roots: auto
      # Every atomic module here is encoder-produced and carries an apply
      # manifest under .axiom/encoding-manifests/. The modules on main came
      # from a local bootstrap build of axiom-encode (the 55beb160 ref plus five
      # fixes for Hebrew source text; each manifest records the exact version
      # and commit), and their manifests are signed with a throwaway local key,
      # not the production apply key the guard verifies. On an ordinary content
      # pull request the guard checks the modules it changes, so those stay as
      # they are on main. When a pull request changes a pinned dependency or the
      # shared workflow ref, the shared workflow instead audits every manifest at
      # base and head, each with its own encoder and corpus, and fails only on
      # issues new at head. A new or changed module has to come from the
      # supervised encoder (axiom-encode's "Targeted signed RuleSpec re-encode"),
      # against the release pinned in .axiom/toolchain.toml.
      run-generated-guard: true
      guard-programs-root: false
