name: Repository Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    uses: TheAxiomFoundation/.github/.github/workflows/validate-rulespec.yml@842c69d6aa62a0d75a4da850fabc3d0df20701d7
    secrets: inherit
    with:
      # axiom-encode main at 5d4562d822e6d4a53420f0f9cb0a5891a7edf6fe (encoder 0.2.1964):
      # Hebrew proof excerpts bind across the wrap space a source sets after a maqaf, from axiom-
      # encode #1615 (on #1585's Hebrew source text).
      axiom-encode-ref: 5d4562d822e6d4a53420f0f9cb0a5891a7edf6fe
      # axiom-rules-engine#169 (Israel ILS currency seed) as merged to main.
      axiom-rules-engine-ref: 1f824237d43c1234d88fea60c8ac2fa7b9b9da4c
      # axiom-corpus#646 as merged to main: the Israel scope il/statute @
      # 2026-09-06-il-taxben-pilot, published as release il-rulespec-2026-09-06
      # (pinned in .axiom/toolchain.toml).
      axiom-corpus-ref: 996b763095ae9cae3761e685827ffd9d97c2a68d
      rulespec-us-ref: 0f291b367bf7e15555f9973112278c5cbf221653
      validate-roots: auto
      # This pilot is hand-authored, not encoder-produced, so the shared
      # generated-content guard (which requires a signed apply manifest on
      # every RuleSpec change) cannot pass. Pinned off deliberately; turned on
      # when encoder-produced content replaces the pilot.
      run-generated-guard: false
      guard-programs-root: false
