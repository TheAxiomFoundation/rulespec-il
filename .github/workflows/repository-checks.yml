name: Repository Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    uses: TheAxiomFoundation/.github/.github/workflows/validate-rulespec.yml@842c69d6aa62a0d75a4da850fabc3d0df20701d7
    secrets: inherit
    with:
      # Same reviewed validator pin rulespec-dk carries.
      axiom-encode-ref: a4599841fa86d608236923c759558d1f21be9d09
      # axiom-rules-engine#169 (Israel ILS currency seed) as merged to main.
      axiom-rules-engine-ref: 1f824237d43c1234d88fea60c8ac2fa7b9b9da4c
      # axiom-corpus#646 as merged to main: the Israel scope il/statute @
      # 2026-09-06-il-taxben-pilot, published as release il-rulespec-2026-09-06
      # (pinned in .axiom/toolchain.toml).
      axiom-corpus-ref: 996b763095ae9cae3761e685827ffd9d97c2a68d
      rulespec-us-ref: 0f291b367bf7e15555f9973112278c5cbf221653
      validate-roots: auto
      # Every atomic module here IS encoder-produced and carries an apply
      # manifest under .axiom/encoding-manifests/. The guard stays off for one
      # reason only: those manifests were produced by a local bootstrap build of
      # axiom-encode — the 55beb160 ref plus five fixes for Hebrew source text,
      # with each manifest recording the exact version and commit — and signed
      # with a throwaway local key that no shared keyring knows, because the
      # pinned validator ref refuses to run before a signed Israel corpus
      # release exists. Turn this on in the same PR that re-encodes at the
      # pinned ref, after the corpus release il-rulespec-2026-09-06 is cut,
      # signed and registered.
      run-generated-guard: false
      guard-programs-root: false
