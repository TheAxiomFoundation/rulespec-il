name: Repository Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    uses: TheAxiomFoundation/.github/.github/workflows/validate-rulespec.yml@842c69d6aa62a0d75a4da850fabc3d0df20701d7
    secrets: inherit
    with:
      # axiom-encode main at a88eec3715319cca9f47a03db0f7443772bc8fe4 (encoder 0.2.2076):
      # numeric grounding reads a pipe-table column under a Hebrew percent heading as
      # percentages, and keeps a leading empty cell in its column, from axiom-encode #1744.
      axiom-encode-ref: a88eec3715319cca9f47a03db0f7443772bc8fe4
      # axiom-rules-engine#169 (Israel ILS currency seed) as merged to main.
      axiom-rules-engine-ref: 1f824237d43c1234d88fea60c8ac2fa7b9b9da4c
      # axiom-corpus#646 as merged to main: the Israel scope il/statute @
      # 2026-09-06-il-taxben-pilot, published as release il-rulespec-2026-09-06
      # (pinned in .axiom/toolchain.toml).
      axiom-corpus-ref: 996b763095ae9cae3761e685827ffd9d97c2a68d
      rulespec-us-ref: 0f291b367bf7e15555f9973112278c5cbf221653
      validate-roots: auto
      # Every atomic module here is encoder-produced and carries an apply
      # manifest under .axiom/encoding-manifests/. Those manifests came from a
      # local bootstrap build of axiom-encode (the 55beb160 ref plus five fixes
      # for Hebrew source text; each manifest records the exact version and
      # commit), signed with a throwaway local key, because the pinned validator
      # ref refuses to run before a signed Israel corpus release exists.
      # The guard is on anyway. It checks the modules a pull request changes,
      # so the existing modules stay as they are on main; any change to them
      # has to come from the supervised encoder at the pinned ref, which first
      # needs the corpus release il-rulespec-2026-09-06 to be cut, signed and
      # registered. Until then no module here can change.
      run-generated-guard: true
      guard-programs-root: false
