format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: il/policy/israel-tax-authority/adjusted-amounts
    source_sha256: edc68a8ea391a9d298e8dc4119a4bc0e403b0c889156c742845b270d97262d01
  summary: |-
    רשות המסים — the Tax Authority's own "לוח עזר לחישוב מס הכנסה ממשכורת ושכר עבודה" booklet, tax years 2025 and 2026.

    WHY THIS MODULE EXISTS. Three quantities this pilot needs are fixed by indexation under §120א/§120ב rather than stated as amounts in the Ordinance, so the consolidation cannot supply them: the §33א credit-point value (the Ordinance states a nominal 504), the §121ב additional-tax threshold (nominal 640,000), and — for 2025 — the upper bound of the 35% band, whose captured 2025 expression of §121(א)(2) is internally defective. Until this capture, all three were supplied to fixtures from the OECD TaxBEN Israel description, which is a reference and not law. They now come from the publisher.

    WHAT THE PUBLISHER SETTLES, AND WHAT IT DOES NOT. This is an official publication of the body that administers the tax, so it is admissible here as a current-year amount under this repository's source rules. It is NOT the statute, it is not a gazette notice, and it is not encoded as law: every rule here is named `published_*` and every proof atom cites this publication, never the Ordinance. Where the booklet and the encoded statute agree, they were arrived at independently.

    THE FREEZE IS VISIBLE IN THE PUBLICATION ITSELF. §120ב(ה)(1) freezes the indexed amounts for tax years 2025 to 2027. Both booklets state the credit point as 242 לחודש and the §121ב threshold as ₪721,560 — identical figures a year apart. That is the publisher demonstrating the freeze the statute states, not this repository inferring it.

    AMENDMENT 288 IS VISIBLE TOO. The 20% and 31% band ceilings move between the two booklets — 193,800 → 228,000 and 269,280 → 301,200 — which is exactly what ס"ח 3511 (חוק ההתייעלות הכלכלית 2026, s.5, in force 1 January 2026) enacted. The pilot read that widening from the gazette first; the Tax Authority's booklet is an independent confirmation.

    THE ANNUAL CREDIT-POINT VALUE IS DERIVED, NOT PUBLISHED. The booklet states 242 לחודש and nowhere states 2,904. `published_credit_point_value_annual_ils` multiplies by twelve. The widely quoted 2,904 is that product, and this module says so rather than citing a figure the publication does not contain.

    EXTRACTION IS LOSSY AND THAT IS ON THE RECORD. A Hebrew PDF table does not survive text extraction unchanged. The registered provision text is the `pdftotext -layout` rendering with bidi controls dropped, NFC-normalized, intra-line whitespace collapsed (ops/il-lane/extract/ita_booklet.py). Excerpts drawn from table rows carry that extractor's column order, not the printed order — `560,280 269,281עד- מ-` is the 35% row of the 2025 annual schedule, upper bound first. Excerpts were chosen only where the label and its number are unambiguous within the extracted line, and every one was accepted by axiom-encode's own evidence matcher, which is stricter than a substring test and rejected several spans a substring test accepted.

    WHAT THE 2025 BAND ATOMS PROVE, EXACTLY. For 2026 the booklet states each changed band in prose and the excerpt carries the bounds AND the rate (`עד 228,000ש"ח – יחול שיעור מס . 20%`). For 2025 the booklet gives the schedule only as a table, and the span the matcher accepts carries the band's bounds without the rate cell, which sits in the same extracted row. So a 2025 band atom proves the boundary, and the rate association rests on the row and on `source`, not on the excerpt alone. That is weaker than the 2026 atoms and is said here rather than glossed. The rates themselves are encoded from the Ordinance in `il/statutes/income-tax-ordinance/section-121.yaml`, which is where they belong; this module exists for the AMOUNTS. See docs/ENCODING-GAPS.md, `ita-booklet-table-extraction`.
