format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: il/policy/national-insurance-institute/child-allowance-rates
    source_sha256: 93614f66a62b858f838dd56bd7f143bc8602c77cf5e1ee1a694c32b2f5c3b86e
  summary: 'המוסד לביטוח לאומי — published child allowance amounts, from 1 January 2026.


    The National Insurance Law states the child allowance as הסכום הבסיסי, a nominal

    amount under an updating mechanism (§1 definition, paragraph (2): 150 / 188 /

    140 shekels). The amounts actually paid are published by the National Insurance

    Institute, and this module carries that publication — the ONLY admissible source

    for a current-year regulated amount under this repository''s source rules.


    Captured 2026-09-06 from the Institute''s "סכום קצבת הילדים" page, which states

    "(החל מ- 01.01.2026)". The amounts are therefore encoded with effective_from

    2026-01-01 and nothing here claims to state the 2025 amounts.


    2025 IS NOT COVERED. No official capture of the 2025 amounts was obtained, so

    the 2025 fixtures elsewhere in this repository supply 169 / 214 from the OECD

    TaxBEN Israel description and label them as a reference, not as law. See

    docs/ENCODING-GAPS.md, gap `child-allowance-2025-amounts-not-officially-captured`.


    EFFECTIVE DATES CLAIM NOTHING HISTORICAL. Every version here starts 2025-01-01,

    the earliest date this pilot speaks for, except where a captured gazette act

    establishes a later commencement. The captured consolidations carry amendment

    LISTS but no commencement clauses, so an earlier effective_from would be an

    assertion the sources do not support. See docs/ENCODING-GAPS.md,

    `effective-from-dates-are-pilot-scope-not-commencement`.'
