format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: il/policy/national-insurance-institute/child-allowance-rates
    source_sha256: 44adddfc88acdc0fa5fecb1fba9c66c657871867049ba8dcb6555b68a67ffeb5
  summary: 'המוסד לביטוח לאומי — published child allowance amounts, 2025 and 2026.


    The National Insurance Law states the child allowance as הסכום הבסיסי, a nominal

    amount under an updating mechanism (§1 definition, paragraph (2): 150 / 188 /

    140 shekels). The amounts actually paid are published by the National Insurance

    Institute, and this module carries that publication — the ONLY admissible source

    for a current-year regulated amount under this repository''s source rules.


    TWO SNAPSHOTS OF ONE OFFICIAL PAGE, both of the Institute''s "סכום קצבת הילדים":

    * 2026 — the live page, captured 2026-09-06, stating "(החל מ- 01.01.2026)".

      sha256 44adddfc88acdc0fa5fecb1fba9c66c657871867049ba8dcb6555b68a67ffeb5.

    * 2025 — the same page as it stood on 2025-04-20, retrieved from the Internet

      Archive because the live page no longer states the 2025 amounts. Stating

      "(החל ב- 01.01.2025)". sha256

      a150c2e4b3237be0b83868fd798e8b00404a41550187645fe95146a5bfaf1287.

      The publisher is the Institute; the archive is the delivery channel, not the

      publisher, and the retrieved bytes are recorded with their own provenance.

    `source_sha256` above names the CURRENT snapshot, following the convention this

    repository uses for §121, which likewise has two captured expressions.


    THE INCOME-SUPPORT INCREMENT IS ALSO PUBLISHED HERE. Both snapshots carry the

    sentence "התוספת משולמת עבור הילד השלישי והרביעי במשפחה בסך N ש״ח לכל ילד" —

    111 in 2025, 113 in 2026. That is the Institute''s own figure for the addition

    NII §68(ג) states as 70% of the §1(2)(ג) basic amount. This repository does NOT

    reproduce it from the encoded formula, because no official §1(2)(ג) basic amount

    has been captured for either year; the divergence is recorded in

    docs/ENCODING-GAPS.md as `nii-68c-published-increment-vs-encoded-formula`.


    NOTHING HERE IS LAW. These are published administrative amounts. The statutory

    structure that consumes them is in il/statutes/national-insurance-law-1995/.'
