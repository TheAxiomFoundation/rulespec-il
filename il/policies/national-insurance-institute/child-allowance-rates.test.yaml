# Companion fixtures for the captured ביטוח לאומי published child allowance
# amounts. These assert the PUBLICATION, not the law: the statutory structure is
# in il/statutes/national-insurance-law-1995/.
#
# Two official snapshots of the Institute's own "סכום קצבת הילדים" page:
#   2025 — the page as it stood 2025-04-20, retrieved from the Internet Archive
#          because the live page no longer states the 2025 amounts. It states
#          "(החל ב- 01.01.2025)": 169 / 214 / 169, increment 111.
#   2026 — the live page, captured 2026-09-06. It states "(החל מ- 01.01.2026)":
#          173 / 219 / 173, increment 113.
# Both snapshots also carry the §68(ג) income-support increment sentence. Session
# 1 of this pilot extracted only the rate table and recorded the increment as
# "not captured"; it was in the captured bytes all along.

- name: birth_order_1_is_paid_169_in_2025
  period:
    period_kind: month
    start: '2025-01-01'
    end: '2025-12-31'
  input:
    il:policies/national-insurance-institute/child-allowance-rates#input.child_birth_order: 1
    il:policies/national-insurance-institute/child-allowance-rates#input.parent_receives_one_of_the_listed_subsistence_benefits: false
  output:
    il:policies/national-insurance-institute/child-allowance-rates#published_monthly_allowance_for_child_ils: 169
    il:policies/national-insurance-institute/child-allowance-rates#published_monthly_income_support_increment_for_child_ils: 0
