format: rulespec/v1
imports:
- il:statutes/national-insurance-law-1995/section-1#child_takes_the_higher_basic_amount
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: il/statute/national-insurance-law-1995/section-68
    source_sha256: 7e16e68531d28f55f6ad926de60b61aaa00f19f2a2e5b5ecbfd56ad7250378da
  summary: 'חוק הביטוח הלאומי, סעיף 68 — the amount of the child allowance.


    §68(א): the monthly allowance for each child in the parent''s count equals the

    basic amount fixed for that child (§1 definition, paragraph (2)).

    §68(ב)(2)-(3): for a child BORN BEFORE 1 June 2003 who is the fourth or a later

    child in the count, the allowance is the paragraph (2)(א) basic amount

    multiplied by 2.24 (fourth child) or 2.36 (fifth and later).

    §68(ג): a parent receiving an income-support benefit or a monthly maintenance

    payment, entitled for three or more children in that month, receives a further

    70% of the paragraph (2)(ג) basic amount for the third and the fourth child.


    STRUCTURE IS STATUTORY, LEVEL IS SUPPLIED. The multipliers, the 70%, the

    three-child condition and the birth-order rules are parameters with proof atoms.

    The current-year basic amounts are published by the National Insurance Institute

    and no official capture exists in this pilot, so they enter as the supplied

    inputs `current_basic_amount_first_and_fifth_plus_ils`,

    `current_basic_amount_second_third_fourth_ils` and

    `current_basic_amount_income_support_base_ils`. Every fixture states where its

    supplied numbers came from. See docs/ENCODING-GAPS.md.


    NOT ENCODED: §68(ב)(1) and §68(ד)-(יא) are repealed or empty in the captured

    expression and are not encoded.'
rules:
- name: fourth_child_born_before_june_2003_multiplier
  kind: parameter
  dtype: Decimal
  source: סעיף 68(ב)(2)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: il/statute/national-insurance-law-1995/section-68
          excerpt: שהוא הילד הרביעי במניין ילדיו של ההורה – סכום השווה לסכום הבסיסי הקבוע בפסקה (2)(א)
            שבהגדרה ”הסכום הבסיסי“ כשהוא מוכפל ב־2.24
  versions:
  - effective_from: '2003-06-01'
    formula: '2.24'
- name: fifth_and_later_child_born_before_june_2003_multiplier
  kind: parameter
  dtype: Decimal
  source: סעיף 68(ב)(3)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: il/statute/national-insurance-law-1995/section-68
          excerpt: שהוא הילד החמישי ואילך במניין ילדיו של ההורה – סכום השווה לסכום הבסיסי הקבוע בפסקה
            (2)(א) שבהגדרה ”הסכום הבסיסי“ כשהוא מוכפל ב־2.36
  versions:
  - effective_from: '2003-06-01'
    formula: '2.36'
- name: income_support_increment_rate
  kind: parameter
  dtype: Rate
  source: סעיף 68(ג)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: il/statute/national-insurance-law-1995/section-68
          excerpt: תוספת בסכום השווה ל־70% מן הסכום הבסיסי הקבוע בפסקה (2)(ג)
  versions:
  - effective_from: '2003-06-01'
    formula: '0.70'
- name: income_support_increment_minimum_children
  kind: parameter
  dtype: Integer
  source: סעיף 68(ג)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: il/statute/national-insurance-law-1995/section-68
          excerpt: בעד שלושה ילדים או יותר
  versions:
  - effective_from: '2003-06-01'
    formula: '3'
- name: income_support_increment_applies_to_child
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: סעיף 68(ג)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: il/statute/national-insurance-law-1995/section-68
          excerpt: הורה שמשתלמים לו בעד חודש מסוים גמלה לפי חוק הבטחת הכנסה או תשלום חודשי לפי חוק המזונות
            (הבטחת תשלום), התשל״ב–1972
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: il/statute/national-insurance-law-1995/section-68
          excerpt: תיווסף לקצבת הילדים המשתלמת לו בעד הילד השלישי ובעד הילד הרביעי שבמנין ילדיו
  versions:
  - effective_from: '2003-06-01'
    formula: parent_receives_income_support_or_maintenance_payment and children_in_parent_count >= income_support_increment_minimum_children
      and child_birth_order >= 3 and child_birth_order <= 4
- name: monthly_child_allowance_ils
  kind: derived
  entity: Person
  dtype: Money
  unit: ILS
  period: Month
  source: סעיף 68(א), (ב) ו־(ג)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: il/statute/national-insurance-law-1995/section-68
          excerpt: קצבת הילדים לחודש בעד כל ילד שבמנין ילדיו של ההורה תהיה בסכום השווה לסכום הבסיסי הקבוע
            לגביו
      - path: versions[0].formula
        kind: ordering
        source:
          corpus_citation_path: il/statute/national-insurance-law-1995/section-68
          excerpt: על אף הוראות סעיף קטן (א), קצבת הילדים לחודש בעד ילד שנולד לפני יום א׳ בסיון התשס״ג
            (1 ביוני 2003), והוא הילד הרביעי ואילך שבמנין ילדיו של ההורה, תהיה בסכום כמפורט להלן
  versions:
  - effective_from: '2003-06-01'
    formula: "if child_born_before_june_2003 and child_birth_order == 4:\n  current_basic_amount_first_and_fifth_plus_ils\
      \ * fourth_child_born_before_june_2003_multiplier\n  + (if income_support_increment_applies_to_child:\n\
      \       income_support_increment_rate * current_basic_amount_income_support_base_ils\n     else:\
      \ 0)\nelif child_born_before_june_2003 and child_birth_order >= 5:\n  current_basic_amount_first_and_fifth_plus_ils\
      \ * fifth_and_later_child_born_before_june_2003_multiplier\nelif child_takes_the_higher_basic_amount:\n\
      \  current_basic_amount_second_third_fourth_ils\n  + (if income_support_increment_applies_to_child:\n\
      \       income_support_increment_rate * current_basic_amount_income_support_base_ils\n     else:\
      \ 0)\nelse: current_basic_amount_first_and_fifth_plus_ils"
