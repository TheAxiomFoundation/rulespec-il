format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: il/statute/national-insurance-law-1995/section-68
  summary: "קצבת הילדים לח\
    ודש בעד כל ילד תה\
    יה בסכום הבסיסי\
    \ הקבוע לגביו. ליל\
    ד שנולד לפני 1 ביו\
    ני 2003 והוא הרביעי\
    \ או החמישי ואילך\
    \ נקבעו מכפילים מ\
    יוחדים; להורה המ\
    קבל גמלת הבטחת ה\
    כנסה או תשלום חו\
    דשי לפי חוק המזו\
    נות מתווספת בעד\
    \ הילד השלישי והר\
    ביעי תוספת של 70% מ\
    ן הסכום הבסיסי, כ\
    אשר הוא זכאי בעד\
    \ שלושה ילדים או י\
    ותר."
imports:
- il:statutes/national-insurance-law-1995/section-1#child_allowance_first_and_fifth_onward_base_amount
- il:statutes/national-insurance-law-1995/section-1#child_allowance_second_third_and_fourth_base_amount
- il:statutes/national-insurance-law-1995/section-1#child_allowance_income_support_or_section_68_c_base_amount
