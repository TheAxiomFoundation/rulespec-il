format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: &corpus il/statute/national-insurance-law-1995/schedule-j/sign-1
  summary: |-
    שיעור דמי ביטוח בעד אפריל שנת 2011 ואילך
    (הוראת שעה לשנים 2025–2026):
    (הנוסח הקבוע):
    הקצבת אוצר המדינה לפי סעיף 32(ג1)
  deferred_outputs:
    - output: il:statutes/national-insurance-law-1995/schedule-j/sign-1#state_treasury_allocation_under_section_32_by_branch
      reason: >-
        Column E does not specify a unit or percentage basis. Its printed
        figures are retained as Decimal parameters, but converting them to
        allocation rates or amounts requires section 32(c1), which is not
        supplied.
    - output: il:statutes/national-insurance-law-1995/schedule-j/sign-1#total_state_treasury_allocation_under_section_32
      reason: >-
        The printed total 0.67 has no stated unit in column E. It is retained
        as a Decimal parameter; its interpretation as a rate or allocation
        amount requires the unavailable section 32(c1).
