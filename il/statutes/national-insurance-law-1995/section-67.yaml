format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: il/statute/national-insurance-law-1995/section-67
  summary: |-
    לא יבוא ילד, בפרק זמן אחד, במנין ילדים של יותר מהורה מבוטח אחד. ילד שיש לו שני הורים, יבוא במנין האב המבוטח זולת אם הוא נמצא עם האם בלבד.
rules:
  - name: child_counted_with_insured_parent
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: National Insurance Law, 1995, section 67(a)-(b)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: il/statute/national-insurance-law-1995/section-67
              excerpt: "לא יבוא ילד, בפרק זמן אחד, במנין ילדים של יותר מהורה מבוטח אחד"
          - path: versions[0].formula
            kind: ordering
            source:
              corpus_citation_path: il/statute/national-insurance-law-1995/section-67
              excerpt: "יבוא במנין האב המבוטח זולת אם הוא נמצא עם האם בלבד"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: il/statute/national-insurance-law-1995/section-67
              excerpt: "יבוא במנין ילדי אותו הורה אשר עמו הוא נמצא"
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          (child_has_two_parents
          and ((current_insured_parent_is_father
          and not child_is_with_mother_alone)
          or ((not current_insured_parent_is_father)
          and child_is_with_mother_alone)))
          or (child_has_natural_and_other_parent
          and child_is_with_current_insured_parent)
