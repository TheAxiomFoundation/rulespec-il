# Companion fixtures for NII §67: a child is counted with exactly one INSURED
# parent. With two insured parents the child goes to the father, unless the child
# is with the mother alone.
#
# ALL SIXTEEN combinations of the four Boolean inputs are exercised. An earlier
# revision claimed that and ran six, and the gap hid a real defect: the two-parent
# branches did not test this_parent_is_insured at all, so an UNINSURED father of a
# child with two parents was counted. §67(א) — "לא יבוא ילד ... במנין ילדים של
# יותר מהורה מבוטח אחד" — and §67(ב)'s "האב המבוטח" both turn on insurance, so it
# now gates every branch. The four cases with this_parent_is_insured=false are the
# regression test.

- name: two_parents_with_the_mother_only_insured_father
  period:
    period_kind: month
    start: '2025-01-01'
    end: '2025-12-31'
  input:
    il:statutes/national-insurance-law-1995/section-67#input.child_has_two_parents: true
    il:statutes/national-insurance-law-1995/section-67#input.child_is_with_the_mother_only: true
    il:statutes/national-insurance-law-1995/section-67#input.this_parent_is_insured: true
    il:statutes/national-insurance-law-1995/section-67#input.this_parent_is_the_father: true
  output:
    il:statutes/national-insurance-law-1995/section-67#child_counts_with_this_parent: false
- name: two_parents_with_the_mother_only_insured_mother
  period:
    period_kind: month
    start: '2025-01-01'
    end: '2025-12-31'
  input:
    il:statutes/national-insurance-law-1995/section-67#input.child_has_two_parents: true
    il:statutes/national-insurance-law-1995/section-67#input.child_is_with_the_mother_only: true
    il:statutes/national-insurance-law-1995/section-67#input.this_parent_is_insured: true
    il:statutes/national-insurance-law-1995/section-67#input.this_parent_is_the_father: false
  output:
    il:statutes/national-insurance-law-1995/section-67#child_counts_with_this_parent: true
- name: two_parents_with_the_mother_only_uninsured_father
  period:
    period_kind: month
    start: '2025-01-01'
    end: '2025-12-31'
