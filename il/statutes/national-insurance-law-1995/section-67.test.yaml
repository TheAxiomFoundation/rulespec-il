
# Companion fixtures for NII §67: a child is counted with exactly one insured
# parent. With two insured parents the child goes to the father, unless the child
# is with the mother alone. Every combination of the four Boolean inputs that the
# section distinguishes is exercised, both truth values each.

- name: two_insured_parents_child_counts_with_the_father
  period:
    period_kind: month
    start: '2025-01-01'
    end: '2025-12-31'
  input:
    il:statutes/national-insurance-law-1995/section-67#input.child_has_two_parents: true
    il:statutes/national-insurance-law-1995/section-67#input.child_is_with_the_mother_only: false
    il:statutes/national-insurance-law-1995/section-67#input.this_parent_is_insured: true
    il:statutes/national-insurance-law-1995/section-67#input.this_parent_is_the_father: true
  output:
    il:statutes/national-insurance-law-1995/section-67#child_counts_with_this_parent: true
- name: two_insured_parents_the_mother_does_not_count_the_child
  period:
    period_kind: month
    start: '2025-01-01'
    end: '2025-12-31'
  input:
    il:statutes/national-insurance-law-1995/section-67#input.child_has_two_parents: true
    il:statutes/national-insurance-law-1995/section-67#input.child_is_with_the_mother_only: false
    il:statutes/national-insurance-law-1995/section-67#input.this_parent_is_insured: true
    il:statutes/national-insurance-law-1995/section-67#input.this_parent_is_the_father: false
  output:
    il:statutes/national-insurance-law-1995/section-67#child_counts_with_this_parent: false
- name: child_with_the_mother_alone_counts_with_her_not_the_father
  period:
    period_kind: month
    start: '2025-01-01'
    end: '2025-12-31'
  input:
    il:statutes/national-insurance-law-1995/section-67#input.child_has_two_parents: true
    il:statutes/national-insurance-law-1995/section-67#input.child_is_with_the_mother_only: true
    il:statutes/national-insurance-law-1995/section-67#input.this_parent_is_insured: true
    il:statutes/national-insurance-law-1995/section-67#input.this_parent_is_the_father: true
  output:
    il:statutes/national-insurance-law-1995/section-67#child_counts_with_this_parent: false
- name: child_with_the_mother_alone_counts_with_the_mother
  period:
    period_kind: month
    start: '2025-01-01'
    end: '2025-12-31'
  input:
    il:statutes/national-insurance-law-1995/section-67#input.child_has_two_parents: true
    il:statutes/national-insurance-law-1995/section-67#input.child_is_with_the_mother_only: true
    il:statutes/national-insurance-law-1995/section-67#input.this_parent_is_insured: true
    il:statutes/national-insurance-law-1995/section-67#input.this_parent_is_the_father: false
  output:
    il:statutes/national-insurance-law-1995/section-67#child_counts_with_this_parent: true
- name: single_insured_parent_counts_the_child
  period:
    period_kind: month
    start: '2025-01-01'
