  input:
    il:statutes/national-insurance-law-1995/section-67#input.child_has_two_parents: false
    il:statutes/national-insurance-law-1995/section-67#input.child_is_with_the_mother_only: false
    il:statutes/national-insurance-law-1995/section-67#input.this_parent_is_insured: true
    il:statutes/national-insurance-law-1995/section-67#input.this_parent_is_the_father: false
  output:
