format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: il/statute/national-insurance-law-1995/section-1
    source_sha256: cf5a4206e0ac19e15bfc73dfb1c2ce674812c35d60060f4b029e1a30d817be24
  summary: "חוק הביטוח הלאומי [נוסח משולב], התשנ\"ה-1995, סעיף 1 — הסכום הבסיסי, paragraph (2).\n\nThe\
    \ child allowance in §68 is expressed entirely as a function of הסכום הבסיסי\n(the basic amount),\
    \ which §1 defines separately for each family of benefits.\nThis module encodes ONLY paragraph (2),\
    \ the definition that applies to the child\nallowance under סימן ב' בפרק ד':\n\n  (2)(א)  first child,\
    \ and fifth and later — 150 shekels\n  (2)(ב)  second, third and fourth child   — 188 shekels\n  (2)(ג)\
    \  for an income-support benefit, or the §68(ג) increment — 140 shekels\n\nTHESE ARE NOMINAL AMOUNTS.\
    \ §1 goes on to prescribe how the basic amount is\nupdated, and the definition's shekel figures are\
    \ the base of that updating, not\nthe sum anyone receives. The current-year amounts are published\
    \ by the National\nInsurance Institute and are not captured here, so they enter §68 as supplied\n\
    inputs. This module gives the STRUCTURE — which child gets which basic amount —\nand that structure\
    \ is statutory.\n\nParagraphs (1) and (3) of the definition, which cover maternity, work-injury,\n\
    disability and the residual benefits, are not encoded."
