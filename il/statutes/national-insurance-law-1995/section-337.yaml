          - path: versions[0].formula
            kind: import
            import:
              target: il:statutes/national-insurance-law-1995/schedule-j/sign-1#total_employee_contribution_within_reduced_band
              output: total_employee_contribution_within_reduced_band
              hash: sha256:56c90be2331cb4ca2f50b735175ad34b94c2f325f569d469b652761d6296301b
          - path: versions[0].formula
            kind: import
