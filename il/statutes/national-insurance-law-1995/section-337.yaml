              target: il:statutes/national-insurance-law-1995/schedule-j/sign-1#total_employee_contribution_above_reduced_band
              output: total_employee_contribution_above_reduced_band
              hash: sha256:56c90be2331cb4ca2f50b735175ad34b94c2f325f569d469b652761d6296301b
          - path: versions[0].formula
            kind: import
            import:
              target: il:statutes/national-insurance-law-1995/section-334#reduced_collection_bracket
              output: reduced_collection_bracket
              hash: sha256:f3c980323ef2936527e96f3e3c916f59921e6cb17e4520a9d51154a836106ea1
    versions:
      - effective_from: '2026-01-01'
        formula: |-
          total_employee_contribution_within_reduced_band
          * min(max(0, employee_monthly_income_counted_for_contributions), reduced_collection_bracket)
          + total_employee_contribution_above_reduced_band
          * max(0, employee_monthly_income_counted_for_contributions - reduced_collection_bracket)

