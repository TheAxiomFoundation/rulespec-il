format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: il/statute/national-insurance-law-1995/section-337
  summary: |-
    (א) (1) שיעורי דמי הביטוח החודשיים לפי סעיף 335 לענין עובד הם אחוזים כאמור בלוח י׳, מהכנסתו החודשית.
    (ב) השר, באישור ועדת הכספים של הכנסת, רשאי לשנות בצו את שיעורי דמי הביטוח האמורים בלוח י׳, ואולם שינוי שיעורי דמי הביטוח לענין זכויות עובדים בהליכי חדלות פירעון ייעשה לאחר התייעצות עם שר האוצר, ולענין ביטוח סיעוד – בהסכמת שר האוצר.
    (ג) שונה שיעור דמי הביטוח מכוח סעיף קטן (ב), ישונה, באותה דרך ובאופן יחסי, שיעור דמי הביטוח שמעביד ינכה משכרו של עובד לפי סעיף 342(ג).
  deferred_outputs:
    - output: il:statutes/national-insurance-law-1995/section-337/a/1#employee_monthly_contribution_income_assessment
      reason: >-
        The copied section 348 export computes only the income ceiling and
        explicitly defers minimum-income deeming. It does not supply the
        complete assessed contribution income. The executable monthly
        rate application therefore consumes employee_monthly_income_counted_for_contributions
        as an already-assessed person-level legal base, including applicable
        income limits and deeming, rather than treating the partial ceiling
        export as the complete base.
    - output: il:statutes/national-insurance-law-1995/section-337/a/2#other_insured_annual_insurance_contributions
      reason: >-
        Annual income must be divided among the periods prescribed for
        advance payments. The copied context does not provide that allocation
        or the corresponding period-specific application of the reduced
        collection bracket. Applying a monthly bracket directly to annual
        income would not implement this subsection.
    - output: il:statutes/national-insurance-law-1995/section-337/c#employee_deduction_rate_after_order
      reason: >-
        A contribution-rate change under subsection (b) requires a proportional
        change to the employer's employee-wage deduction rate through the
        same procedure. The copied section 342 module defers its subsection
        (c) deduction computation and supplies no executable applicable
        deduction-rate output. The schedule's rate tables do not identify
        the before-and-after rates for a particular ministerial order.
imports:
  - il:statutes/national-insurance-law-1995/schedule-j/sign-1#total_employee_contribution_within_reduced_band
  - il:statutes/national-insurance-law-1995/schedule-j/sign-1#total_employee_contribution_above_reduced_band
  - il:statutes/national-insurance-law-1995/section-334#reduced_collection_bracket
rules:
