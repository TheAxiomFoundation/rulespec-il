  - name: nonwork_income_excluded_from_contributions_under_section_335
    kind: derived
    entity: Person
    dtype: Money
    unit: ILS
    period: Month
    source: National Insurance Law, 1995, section 348(a1)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: il/statute/national-insurance-law-1995/section-348
              excerpt: לעניין דמי ביטוח המשתלמים לפי הוראות סעיף 335
          - path: versions[0].formula
            kind: definition
            source:
              corpus_citation_path: il/statute/national-insurance-law-1995/section-348
              excerpt: >-
                מהמקורות המפורטים בסעיף 2 לפקודת מס הכנסה, שאינה הכנסה
                מעבודתו כעובד או כעובד עצמאי, אשר אינה פטורה מתשלום
                דמי ביטוח לפי סעיף 350
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: il/statute/national-insurance-law-1995/section-348
              excerpt: לא תובא בחשבון
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: il/statute/national-insurance-law-1995/section-348
              excerpt: ואינה עולה על סכום השווה ל־25% מהשכר הממוצע
    versions:
