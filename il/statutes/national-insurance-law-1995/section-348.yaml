format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: il/statute/national-insurance-law-1995/section-348
  summary: |-
    (א) לענין דמי ביטוח המשתלמים לפי הוראה מהוראות סעיף 335 לא יבוא בחשבון סכום ההכנסה של המבוטח העולה על הסכום המרבי המתקבל לפי האמור בלוח י״א.
    (א1) לעניין דמי ביטוח המשתלמים לפי הוראות סעיף 335, לא תובא בחשבון ההכנסה של מבוטח מהמקורות המפורטים בסעיף 2 לפקודת מס הכנסה, שאינה הכנסה מעבודתו כעובד או כעובד עצמאי, אשר אינה פטורה מתשלום דמי ביטוח לפי סעיף 350 ואינה עולה על סכום השווה ל־25% מהשכר הממוצע.
    (ג) השר, באישור ועדת הכספים של הכנסת, רשאי לשנות בצו את הסכומים המזעריים האמורים בלוח י״א.
  deferred_outputs:
    - output: il:statutes/national-insurance-law-1995/section-348/b#minimum_deemed_contribution_income
      reason: >-
        The copied Schedule XI module exports quarterly and annual minima,
        but no applicable monthly minimum. The monthly minimum-income
        deeming result requires that upstream monthly computation.
        The employee monthly ceiling encoded here is solely the effect
        of subsection (a), not a complete contribution base.
    - output: il:statutes/national-insurance-law-1995/section-348/d#full_month_unemployment_deemed_contribution_income
      reason: >-
        Receipt of unemployment benefits for a full month under Chapter VII
        requires deeming income equal to the Schedule XI item 3 minimum.
        The copied schedule does not export that monthly minimum; its
        quarterly and annual minima cannot substitute for the missing
        monthly computation.
    - output: il:statutes/national-insurance-law-1995/section-348/e#service_or_religious_student_deemed_contribution_income
      reason: >-
        The copied schedule lacks the monthly item 3 minimum needed for
        persons with no income or income below that minimum. Permanent
        categories are national-service volunteers, community volunteers,
        religious-institution or yeshiva students, and civil-service
        participants defined in section 6(a) of the cited deferment law.
        The temporary wording also covers national-civil-service participants
        until expiry on 2026-08-31, continuing until completion for persons
        who began service before expiry. Neither the monthly minimum nor a
        resulting deemed amount is inferred from quarterly or annual exports.
imports:
  - il:statutes/national-insurance-law-1995/schedule-k/sign-1#employee_monthly_maximum_insurable_income
rules:
