    kind: derived
    entity: Person
    dtype: Money
    unit: ILS
    period: Month
    source: National Insurance Law, 1995, section 348(a), employee monthly ceiling
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: il/statute/national-insurance-law-1995/section-348
              excerpt: לענין דמי ביטוח המשתלמים לפי הוראה מהוראות סעיף 335
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: il/statute/national-insurance-law-1995/section-348
              excerpt: לא יבוא בחשבון סכום ההכנסה של המבוטח העולה על הסכום המרבי המתקבל לפי האמור בלוח י״א
          - path: versions[0].formula
            kind: import
            import:
              target: il:statutes/national-insurance-law-1995/schedule-k/sign-1#employee_monthly_maximum_insurable_income
              output: employee_monthly_maximum_insurable_income
              hash: sha256:c830a3f6f0cde684dbac9ba29b1f6e36051838b77e1f1503b660de14f0c3ad37
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          if contributions_payable_under_section_335:
            min(employee_monthly_income, employee_monthly_maximum_insurable_income)
          else: employee_monthly_income

