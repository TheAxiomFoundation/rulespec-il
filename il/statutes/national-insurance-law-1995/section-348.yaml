        formula: |-
          if contributions_payable_under_section_335:
            if nonwork_income_from_sources_under_income_tax_ordinance_section_2_not_exempt_under_section_350 <= nonwork_income_exclusion_threshold:
              max(0, nonwork_income_from_sources_under_income_tax_ordinance_section_2_not_exempt_under_section_350)
            else: 0
          else: 0
