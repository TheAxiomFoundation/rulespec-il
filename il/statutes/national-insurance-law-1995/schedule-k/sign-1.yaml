format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: il/statute/national-insurance-law-1995/schedule-k/sign-1
  summary: "הכנסה מרבית ומ\
    זערית לענין דמי\
    \ ביטוח\nלחודש – ה\
    סכום הבסיסי, כפו\
    ל 5;\nלחודש – סכום ה\
    שווה לשכר מינימ\
    ום של החודש הראש\
    ון ברבעון;\nלשנה –\
    \ סכום השווה לסך ה\
    הכנסות המרביות\
    \ בכל רבעון שבאות\
    ה שנת מס.\n”שכר מי\
    נימום“ – שכר מינ\
    ימום, שכר מינימו\
    ם חלקי, שכר מינימ\
    ום יומי, או שכר מי\
    נימום לשעה החל, ל\
    פי הענין, לפי הור\
    אות חוק שכר מיני\
    מום לגבי עובד פל\
    וני;\n”הסכום הבסי\
    סי“ – כהגדרתו בפ\
    סקה (3) שבהגדרה סכ\
    ום בסיסי שבסעיף\
    \ 1."
