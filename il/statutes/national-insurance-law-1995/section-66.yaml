format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: il/statute/national-insurance-law-1995/section-66
    source_sha256: 2e18a504ffb542cf668e10685926d5ee134387c181a379d63e098bd5fdb344c4
  summary: 'חוק הביטוח הלאומי, סעיף 66 — the right to a child allowance.


    One sentence, and it reaches across instruments: an insured parent is entitled

    to a monthly child allowance for each child, EXCEPT an insured parent who has

    income liable to the additional tax within the meaning of §121ב of the Income

    Tax Ordinance. The exclusion is why this pilot encodes an income tax section and

    a benefit section together: the benefit cannot be evaluated without the tax

    rule, and the composed capstone imports both.


    `parent_has_income_liable_to_additional_tax` is the input this module takes; in

    the composed pipeline it is supplied consistently with the §121ב module''s own

    `liable_to_additional_tax`, and a fixture exercises the case where the allowance

    is denied for exactly that reason.


    UNRESOLVED DIVERGENCE. The OECD TaxBEN Israel description states that this

    benefit "is not means-tested", which cannot be reconciled with the exclusion this

    section states. Nothing in the captured material settles whether the exclusion is

    operative. This module encodes the captured text and the divergence is recorded

    as `unexplained` in docs/ENCODING-GAPS.md.'
rules:
- name: entitled_to_child_allowance
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: סעיף 66
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: il/statute/national-insurance-law-1995/section-66
          excerpt: הורה מבוטח זכאי לקצבת ילדים חודשית לפי פרק זה בעד כל ילד
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: il/statute/national-insurance-law-1995/section-66
          excerpt: למעט הורה מבוטח שיש לו הכנסה החייבת במס נוסף כמשמעותה בסעיף 121ב לפקודת מס הכנסה
  versions:
  - effective_from: '2013-01-01'
    formula: parent_is_insured and not parent_has_income_liable_to_additional_tax
