
# Companion fixtures for NII §68, the amount of the child allowance.
#
# WHERE THE SUPPLIED AMOUNTS COME FROM — these are not law as stated here:
#   Per-child amounts, BOTH YEARS: the National Insurance Institute's own
#     published table, encoded in
#     il/policies/national-insurance-institute/child-allowance-rates.yaml.
#     2025 (169 / 214) from the Institute's page as it stood 2025-04-20,
#     retrieved from the Internet Archive; 2026 (173 / 219) from the live page
#     captured 2026-09-06. Both are official captures.
#   The §1(2)(ג) special basic amount: NOT CAPTURED FOR EITHER YEAR. Every case
#     supplies the NOMINAL statutory 140 that §1(2)(ג) states and this repository
#     encodes as a parameter. IT IS NOT AN AMOUNT PAYABLE, and the one case that
#     exercises §68(ג) therefore asserts the formula on the nominal base, not a
#     2025 entitlement.
#
#     An earlier revision supplied 153 there, from the OECD TaxBEN description.
#     The Institute's own page states the resulting increment directly — 111 per
#     child in 2025, 113 in 2026 — and 0.7 × 153 = 107.1, which does not reach 111
#     under any rounding convention. The reference figure is inconsistent with the
#     publisher's own number, so it is no longer supplied anywhere. See
#     docs/ENCODING-GAPS.md, `nii-68c-published-increment-vs-encoded-formula`.
#
# Derivations: §68(א) pays the basic amount fixed for the child; §68(ב)(2)-(3)
# multiply the LOWER basic amount by 2.24 / 2.36 for a fourth or later child born
# before 1 June 2003; §68(ג) adds 70% of the special basic amount for the third
# and fourth child when the parent is on income support with three or more
# children.

- name: first_child_takes_the_lower_basic_amount_2026
  period:
    period_kind: month
    start: '2026-01-01'
    end: '2026-12-31'
  input:
    il:statutes/national-insurance-law-1995/section-68#input.child_birth_order: 1
    il:statutes/national-insurance-law-1995/section-1#input.child_birth_order: 1
    il:statutes/national-insurance-law-1995/section-68#input.child_born_before_june_2003: false
    il:statutes/national-insurance-law-1995/section-68#input.children_in_parent_count: 1
    il:statutes/national-insurance-law-1995/section-68#input.parent_receives_income_support_or_maintenance_payment: false
    il:statutes/national-insurance-law-1995/section-68#input.current_basic_amount_first_and_fifth_plus_ils: 173
    il:statutes/national-insurance-law-1995/section-68#input.current_basic_amount_second_third_fourth_ils: 219
    il:statutes/national-insurance-law-1995/section-68#input.current_basic_amount_income_support_base_ils: 140
  output:
    il:statutes/national-insurance-law-1995/section-1#child_takes_the_higher_basic_amount: not_holds
    il:statutes/national-insurance-law-1995/section-68#income_support_increment_applies_to_child: not_holds
    il:statutes/national-insurance-law-1995/section-68#monthly_child_allowance_ils: 173
