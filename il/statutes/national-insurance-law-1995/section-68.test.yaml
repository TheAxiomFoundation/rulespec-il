
# Companion fixtures for NII §68, the amount of the child allowance.
#
# WHERE THE SUPPLIED AMOUNTS COME FROM — these are not law as stated here:
#   2026 (173 / 219): the National Insurance Institute's own published table,
#     captured 2026-09-06 and encoded in
#     il/policies/national-insurance-institute/child-allowance-rates.yaml, which
#     states "(החל מ- 01.01.2026)". This is an official capture.
#   2025 (169 / 214 / 153): the OECD TaxBEN Israel description. A REFERENCE, not
#     an official publication. No official 2025 capture was obtained. The special
#     basic amount is a recorded divergence: TaxBEN gives 153 while the
#     Wikisource editorial annotation gives 158. See docs/ENCODING-GAPS.md.
#   2026 special basic amount: NOT CAPTURED. The Institute's published table gives
#     the per-child amounts but no special basic amount, so the 2026 cases supply
#     the NOMINAL statutory 140 of §1(2)(ג) — a figure this repository encodes as a
#     parameter — and none of the 2026 cases exercises §68(ג), so it is inert there.
#     It is NOT an amount payable, and it is deliberately not the Wikisource
#     editorial annotation, which AGENTS.md forbids as a source for a current amount.
#
# Derivations: §68(א) pays the basic amount fixed for the child; §68(ב)(2)-(3)
# multiply the LOWER basic amount by 2.24 / 2.36 for a fourth or later child born
# before 1 June 2003; §68(ג) adds 70% of the special basic amount for the third
# and fourth child when the parent is on income support with three or more
# children.

