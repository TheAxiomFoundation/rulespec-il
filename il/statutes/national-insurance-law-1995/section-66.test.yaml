
# Companion fixtures for NII §66, the right to a child allowance.
#
# The second case is the cross-instrument link the pilot exists to show: an
# insured parent with income liable to the ITO §121ב additional tax loses the
# allowance outright. Both truth values of both inputs are exercised.

- name: insured_parent_below_the_additional_tax_threshold_is_entitled
  period:
    period_kind: month
    start: '2025-01-01'
    end: '2025-12-31'
  input:
    il:statutes/national-insurance-law-1995/section-66#input.parent_is_insured: true
    il:statutes/national-insurance-law-1995/section-66#input.parent_has_income_liable_to_additional_tax: false
  output:
    il:statutes/national-insurance-law-1995/section-66#entitled_to_child_allowance: holds
- name: insured_parent_liable_to_the_section_121b_additional_tax_is_excluded
  period:
    period_kind: month
    start: '2025-01-01'
    end: '2025-12-31'
  input:
    il:statutes/national-insurance-law-1995/section-66#input.parent_is_insured: true
    il:statutes/national-insurance-law-1995/section-66#input.parent_has_income_liable_to_additional_tax: true
  output:
    il:statutes/national-insurance-law-1995/section-66#entitled_to_child_allowance: not_holds
- name: uninsured_parent_is_not_entitled
  period:
    period_kind: month
    start: '2025-01-01'
    end: '2025-12-31'
  input:
    il:statutes/national-insurance-law-1995/section-66#input.parent_is_insured: false
    il:statutes/national-insurance-law-1995/section-66#input.parent_has_income_liable_to_additional_tax: false
  output:
    il:statutes/national-insurance-law-1995/section-66#entitled_to_child_allowance: not_holds
- name: uninsured_and_liable_parent_is_not_entitled
  period:
    period_kind: month
    start: '2025-01-01'
    end: '2025-12-31'
  input:
    il:statutes/national-insurance-law-1995/section-66#input.parent_is_insured: false
    il:statutes/national-insurance-law-1995/section-66#input.parent_has_income_liable_to_additional_tax: true
  output:
    il:statutes/national-insurance-law-1995/section-66#entitled_to_child_allowance: not_holds
