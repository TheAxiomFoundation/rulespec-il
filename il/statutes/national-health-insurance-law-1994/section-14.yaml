    formula: |-
      employee_health_insurance_rate_reduced * min(monthly_gross_wage_ils, reduced_collection_step_ils)
      + employee_health_insurance_rate_full * max(0, min(monthly_gross_wage_ils, maximum_monthly_income_for_contributions_ils) - reduced_collection_step_ils)
