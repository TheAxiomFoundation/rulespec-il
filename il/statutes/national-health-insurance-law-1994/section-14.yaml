  unit: ILS
  period: Month
  source: סעיף 14(ב)(1) ו־(ו1), עם סעיף 15(א) לענין התקרה
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: il/statute/national-health-insurance-law-1994/section-14
          excerpt: מעביד חייב לשלם למוסד דמי ביטוח בריאות בעד כל עובד מעובדיו
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: il/statute/national-health-insurance-law-1994/section-14
          excerpt: ישלמו על החלק מההכנסה שאינו עולה על הסכום המופחת שנקבע לפי סעיף 341 לחוק הביטוח הלאומי,
            דמי ביטוח בריאות בשיעור של 3.23%
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: il/statute/national-health-insurance-law-1994/section-15
          excerpt: לענין הגביה והתשלום של דמי ביטוח הבריאות יחולו הוראות חוק הביטוח הלאומי, בשינויים המחויבים
            לפי הענין, כאילו היו דמי ביטוח לאומי
  versions:
