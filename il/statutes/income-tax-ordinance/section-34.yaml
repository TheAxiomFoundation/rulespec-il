  source_verification:
    corpus_citation_path: il/statute/income-tax-ordinance/section-34
    source_sha256: 1707b0c0ec236951110ee7ba3da8a5b11665e91cb7d4f3fd0c3bb95f9afbdfb8
  summary: 'סעיף 34 לפקודת מס הכנסה — the resident credit.


    An individual who was resident in Israel during the tax year is credited with

    TWO credit points. The figure of 2.25 that appears in secondary descriptions is

    not this section: it is §34''s two points plus the quarter point §36 gives for

    travel to the place of earning. Each is encoded in its own module.


    THE CONDITION IS AN INPUT. `individual_meets_resident_credit_points_condition`

    stands for the section''s own test — "יחיד שהיה תושב ישראל בשנת המס", an individual

    who was resident in Israel during the tax year. Residence is not derived here;

    the Ordinance''s residence definition (§1) is not encoded in this pilot.'
