
# Companion fixtures for ITO §121ב, מס נוסף.
#
# additional_tax_threshold_for_tax_year_ils is SUPPLIED as 721,560. §121ב states
# 640,000, a nominal amount index-linked under §120ב and frozen at its 2024 level
# for 2025-2027. No official Tax Authority capture of the 2025 indexed figure was
# obtained.
#
# BE PRECISE ABOUT WHERE 721,560 COMES FROM. The OECD TaxBEN Israel description
# does not name the §121ב additional tax at all; its 2025 schedule simply ends
# "560 280 - 721 560 | 47" and "Above 721 560 | 50". Reading its 50% top band as
# the 47% rate plus this section's 3% is an INFERENCE made here, not something
# TaxBEN states. It is corroborated by the Wikisource page's own editorial
# comparison table ("מעל 721,560 | 3% מס נוסף"), which is editorial apparatus and
# cannot ground a proof atom. Both are recorded in docs/ENCODING-GAPS.md.
#
# §121ב(א) says "עלתה על" — exceeded — so income exactly at the threshold is not
# liable, and one fixture pins that boundary.

- name: below_the_threshold_no_additional_tax
  period:
    period_kind: tax_year
    start: '2025-01-01'
    end: '2025-12-31'
  input:
    il:statutes/income-tax-ordinance/section-121b#input.annual_taxable_income_ils: 500000
    il:statutes/income-tax-ordinance/section-121b#input.annual_taxable_income_from_capital_sources_ils: 0
    il:statutes/income-tax-ordinance/section-121b#input.additional_tax_threshold_for_tax_year_ils: 721560
  output:
    il:statutes/income-tax-ordinance/section-121b#liable_to_additional_tax: false
    il:statutes/income-tax-ordinance/section-121b#additional_tax_ils: 0.0
- name: exactly_at_the_threshold_is_not_liable
  period:
    period_kind: tax_year
    start: '2025-01-01'
    end: '2025-12-31'
  input:
    il:statutes/income-tax-ordinance/section-121b#input.annual_taxable_income_ils: 721560
    il:statutes/income-tax-ordinance/section-121b#input.annual_taxable_income_from_capital_sources_ils: 0
    il:statutes/income-tax-ordinance/section-121b#input.additional_tax_threshold_for_tax_year_ils: 721560
  output:
    il:statutes/income-tax-ordinance/section-121b#liable_to_additional_tax: false
    il:statutes/income-tax-ordinance/section-121b#additional_tax_ils: 0.0
- name: three_percent_on_the_excess_over_the_threshold
  period:
    period_kind: tax_year
    start: '2025-01-01'
    end: '2025-12-31'
  input:
    il:statutes/income-tax-ordinance/section-121b#input.annual_taxable_income_ils: 800000
    il:statutes/income-tax-ordinance/section-121b#input.annual_taxable_income_from_capital_sources_ils: 0
    il:statutes/income-tax-ordinance/section-121b#input.additional_tax_threshold_for_tax_year_ils: 721560
  output:
    il:statutes/income-tax-ordinance/section-121b#liable_to_additional_tax: true
    il:statutes/income-tax-ordinance/section-121b#additional_tax_ils: 2353.2
- name: capital_source_income_adds_the_two_percent_of_subsection_a1
  period:
    period_kind: tax_year
    start: '2025-01-01'
    end: '2025-12-31'
  input:
    il:statutes/income-tax-ordinance/section-121b#input.annual_taxable_income_ils: 800000
    il:statutes/income-tax-ordinance/section-121b#input.annual_taxable_income_from_capital_sources_ils: 750000
    il:statutes/income-tax-ordinance/section-121b#input.additional_tax_threshold_for_tax_year_ils: 721560
  output:
    il:statutes/income-tax-ordinance/section-121b#liable_to_additional_tax: true
    il:statutes/income-tax-ordinance/section-121b#additional_tax_ils: 2922.0
- name: capital_source_income_alone_can_trigger_liability
  period:
    period_kind: tax_year
    start: '2025-01-01'
    end: '2025-12-31'
  input:
    il:statutes/income-tax-ordinance/section-121b#input.annual_taxable_income_ils: 500000
    il:statutes/income-tax-ordinance/section-121b#input.annual_taxable_income_from_capital_sources_ils: 750000
    il:statutes/income-tax-ordinance/section-121b#input.additional_tax_threshold_for_tax_year_ils: 721560
  output:
    il:statutes/income-tax-ordinance/section-121b#liable_to_additional_tax: true
    il:statutes/income-tax-ordinance/section-121b#additional_tax_ils: 568.8
