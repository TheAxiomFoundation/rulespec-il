format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: il/statute/income-tax-ordinance/section-36a
    source_sha256: f39dc09fc782d1e639f29e3310c8ff11fdcf0947b6ab3ac25190ff6d820bc104
  summary: 'סעיף 36א לפקודת מס הכנסה — the woman''s credit.


    Half a credit point in computing the tax of a woman. Encoded exactly as the

    section states it; the pilot takes no view on the policy.


    THE CONDITION IS AN INPUT. `individual_meets_woman_credit_points_condition`

    stands for "אשה". Unlike §34 and §36 this section states NO residence

    requirement, and the encoding does not add one.'
rules:
- name: woman_credit_points
  kind: parameter
  dtype: Decimal
  source: סעיף 36א
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: il/statute/income-tax-ordinance/section-36a
          excerpt: בחישוב המס של אשה תובא בחשבון 1⁄2 נקודת זיכוי
  versions:
  - effective_from: '2025-01-01'
    formula: '0.5'
- name: woman_credit_points_claimed
  kind: derived
  entity: Person
  dtype: Decimal
  period: Year
  source: סעיף 36א
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: il/statute/income-tax-ordinance/section-36a
          excerpt: בחישוב המס של אשה תובא בחשבון 1⁄2 נקודת זיכוי
  versions:
  - effective_from: '2025-01-01'
    formula: 'if individual_meets_woman_credit_points_condition: woman_credit_points else: 0'
