format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: il/statute/income-tax-ordinance/section-36a
  summary: |-
    בחישוב המס של אשה תובא בחשבון 1⁄2 נקודת זיכוי.
rules:
  - name: woman_tax_credit_point_count
    kind: parameter
    dtype: Count
    source: Income Tax Ordinance § 36A
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: il/statute/income-tax-ordinance/section-36a
              excerpt: 1⁄2 נקודת זיכוי
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          1 / 2
  - name: tax_credit_points_for_woman
    kind: derived
    entity: Person
    dtype: Count
    period: Year
    source: Income Tax Ordinance § 36A
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: il/statute/income-tax-ordinance/section-36a
              excerpt: בחישוב המס של אשה
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: il/statute/income-tax-ordinance/section-36a
              excerpt: תובא בחשבון 1⁄2 נקודת זיכוי
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          if individual_is_woman: woman_tax_credit_point_count else: 0
