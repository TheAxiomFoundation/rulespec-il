- name: reduced_rates_apply
  kind: derived
  entity: Person
  dtype: Judgment
  period: Year
  source: סעיף 121(ב)(1) ו־(ב)(2)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: il/statute/income-tax-ordinance/section-121
          excerpt: לגבי הכנסה חייבת בשנת המס מיגיעה אישית ולגבי הכנסה חייבת בשנת המס של יחיד שמלאו לו
            60 שנים, יחולו שיעורים אלה
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: il/statute/income-tax-ordinance/section-121
          excerpt: השיעורים המופחתים הקבועים בפסקה (1) לא יחולו על הכנסה שחייבים לגביה בניהול פנקסי חשבונות
            ולא נוהלו לגביה פנקסים קבילים
  versions:
  - effective_from: '2025-01-01'
    formula: income_is_from_personal_exertion_or_individual_is_60_or_over and not books_of_account_required_but_not_kept
- name: income_tax_before_credits_ils
  kind: derived
  entity: Person
  dtype: Money
  unit: ILS
  period: Year
  source: סעיף 121(א) ו־121(ב)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: il/statute/income-tax-ordinance/section-121
          excerpt: המס על הכנסתו החייבת של יחיד בשנת המס יהיה כלהלן
      - path: versions[0].formula
        kind: ordering
        source:
          corpus_citation_path: il/statute/income-tax-ordinance/section-121
          excerpt: על אף האמור בסעיף קטן (א)(1) ובכפוף לאמור בפסקה (2)
  versions:
  - effective_from: '2025-01-01'
    formula: "if reduced_rates_apply:\n  rate_first_band * min(annual_taxable_income_ils, reduced_band_1_upper_ils)\n\
      \  + rate_second_band * max(0, min(annual_taxable_income_ils, reduced_band_2_upper_ils) - reduced_band_1_upper_ils)\n\
      \  + rate_third_band * max(0, min(annual_taxable_income_ils, reduced_band_3_upper_ils) - reduced_band_2_upper_ils)\n\
      \  + rate_fourth_band * max(0, min(annual_taxable_income_ils, reduced_band_4_upper_ils) - reduced_band_3_upper_ils)\n\
      \  + rate_fifth_band * max(0, min(annual_taxable_income_ils, thirty_five_percent_band_upper_ils)\
      \ - reduced_band_4_upper_ils)\n  + rate_top_band * max(0, annual_taxable_income_ils - thirty_five_percent_band_upper_ils)\n\
      else:\n  rate_fourth_band * min(annual_taxable_income_ils, general_first_band_upper_ils)\n  + rate_fifth_band\
      \ * max(0, min(annual_taxable_income_ils, thirty_five_percent_band_upper_ils) - general_first_band_upper_ils)\n\
      \  + rate_top_band * max(0, annual_taxable_income_ils - thirty_five_percent_band_upper_ils)"
