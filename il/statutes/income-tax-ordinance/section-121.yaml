format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: il/statute/income-tax-ordinance/section-121
    source_sha256: 7f8d61ff2d52e718086be0987365a5d92e19e9bb8329ab374f8d2bf2f14bbb9f
  summary: 'סעיף 121 לפקודת מס הכנסה — the individual rate schedule.


    Encodes both the §121(א) general schedule and the §121(ב)(1) reduced schedule

    for income from personal exertion (הכנסה מיגיעה אישית) or for an individual aged

    60 or over, together with the §121(ב)(2) carve-out that withdraws the reduced

    rates where books of account were required and no acceptable books were kept.


    TWO TAX YEARS, TWO SETS OF AMOUNTS. §120ב(ה)(1) froze the indexed amounts for

    tax years 2025-2027 at their 1 January 2024 level, so 2025 and 2026 do not

    differ by indexation. They differ because the Economic Efficiency Law for

    budget year 2026 (ס"ח 3511, פרק ג'' "ריווח מדרגות מס הכנסה", §5 = ITO amendment

    288, with §6 setting תחילה at 1 January 2026) widened the 20% and 31% bands by

    statute: 193,800 -> 228,000 and 269,280 -> 301,200. Each affected parameter

    therefore carries two versions, whose proof atoms cite the two captured

    expressions of §121: the 2025 expression (he.wikisource oldid=2971879, provision

    sha256 __SHA2025__) and the current expression (provision sha256 __SHACUR__).


    NOT A PARAMETER: the boundary between the 35% band and the 47% band enters the

    formula as the supplied input `thirty_five_percent_band_upper_ils`. The current

    consolidation states it cleanly in §121(א)(2) ("עד 560,280 שקלים חדשים"), but the

    captured 2025 expression of the same paragraph is internally inconsistent — it

    reads "מ־560,280 שקלים חדשים עד 542,160 שקלים חדשים", a lower bound above its own

    upper bound — and the defect is present in the 2024-12-31 revision as well.

    Rather than attach a proof atom to text that does not support the value, the

    boundary is supplied and its provenance is stated per fixture. See

    docs/ENCODING-GAPS.md, gap `section-121-a-2-defective-2025-expression`.


    Scope: the schedule only. Credit points are §§33א/34/36/36א/66, the additional

    tax is §121ב, and neither is applied here.


    EFFECTIVE DATES CLAIM NOTHING HISTORICAL. Every version here starts 2025-01-01,

    the earliest date this pilot speaks for, except where a captured gazette act

    establishes a later commencement. The captured consolidations carry amendment

    LISTS but no commencement clauses, so an earlier effective_from would be an

    assertion the sources do not support. See docs/ENCODING-GAPS.md,

    `effective-from-dates-are-pilot-scope-not-commencement`.'
