
# Companion fixtures for ITO §36a.
# Both truth values of the section's condition are exercised, as required.

- name: credit_is_allowed_when_the_condition_is_met
  period:
    period_kind: tax_year
    start: '2025-01-01'
    end: '2025-12-31'
  input:
    il:statutes/income-tax-ordinance/section-36a#input.individual_meets_woman_credit_points_condition: true
  output:
    il:statutes/income-tax-ordinance/section-36a#woman_credit_points: 0.5
    il:statutes/income-tax-ordinance/section-36a#woman_credit_points_claimed: 0.5
- name: credit_is_zero_when_the_condition_is_not_met
  period:
    period_kind: tax_year
    start: '2025-01-01'
    end: '2025-12-31'
  input:
    il:statutes/income-tax-ordinance/section-36a#input.individual_meets_woman_credit_points_condition: false
  output:
    il:statutes/income-tax-ordinance/section-36a#woman_credit_points: 0.5
    il:statutes/income-tax-ordinance/section-36a#woman_credit_points_claimed: 0
