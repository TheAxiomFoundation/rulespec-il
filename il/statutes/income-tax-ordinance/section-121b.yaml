format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: il/statute/income-tax-ordinance/section-121b
    source_sha256: 8a9665a0acb22255edef7d81d6d99c5e0464a7c4aa71ed9f8a2883b2fe4b4e1c
  summary: 'סעיף 121ב לפקודת מס הכנסה — מס נוסף, the additional tax on high income.


    §121ב(א): an individual whose taxable income for the tax year exceeded the

    stated amount owes an additional 3% on the excess. §121ב(א1), added by amendment

    תשפ"ה־2, adds a further 2% on the part of taxable income from capital sources

    exceeding the same amount.


    THRESHOLD LEVEL IS NOT IN THE TEXT AS A CURRENT AMOUNT. The Ordinance states

    640,000 shekels, a nominal figure carried unchanged through the 2024-12-31,

    2025-05-27 and current captured expressions; it is an income ceiling within the

    meaning of §120ב(א) and is therefore index-linked, and §120ב(ה) freezes it at

    its 1 January 2024 level for 2025-2027. The nominal 640,000 is encoded as a

    parameter with its proof; the applied current-year threshold enters as the

    supplied input `additional_tax_threshold_for_tax_year_ils`, whose provenance

    each fixture states. See docs/ENCODING-GAPS.md.


    NOT ENCODED: §121ב(ב) (no §91(ד) advances), §121ב(ג) (notwithstanding any

    enactment), §121ב(ד) (the §8(ג) spreading rule) and §121ב(ה) — the definitions.

    That last one matters: ”הכנסה חייבת ממקור הוני“ is defined in §121ב(ה) by

    excluding §2(1)/(2) income and personal-exertion income, and this module takes

    `annual_taxable_income_from_capital_sources_ils` as a supplied input INSTEAD of

    deriving it from that definition. A fixture cannot therefore prove the boundary

    of the capital-source base. Recorded in docs/ENCODING-GAPS.md.


    This section is also the reason the National Insurance child allowance is

    encoded alongside it: NII §66 denies the allowance to an insured parent who has

    income liable to this additional tax.'
rules:
- name: additional_tax_nominal_threshold_ils
  kind: parameter
  dtype: Money
  unit: ILS
  source: סעיף 121ב(א)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: il/statute/income-tax-ordinance/section-121b
          excerpt: עלתה על 640,000 שקלים חדשים
  versions:
  - effective_from: '2025-01-01'
    formula: '640000'
- name: additional_tax_rate
  kind: parameter
  dtype: Rate
  source: סעיף 121ב(א)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: il/statute/income-tax-ordinance/section-121b
          excerpt: בשיעור של 3%
  versions:
  - effective_from: '2025-01-01'
    formula: '0.03'
- name: additional_tax_on_capital_income_rate
  kind: parameter
  dtype: Rate
  source: סעיף 121ב(א1)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: il/statute/income-tax-ordinance/section-121b
          excerpt: בשיעור של 2%
  versions:
  - effective_from: '2025-01-01'
    formula: '0.02'
- name: liable_to_additional_tax
  kind: derived
  entity: Person
  dtype: Judgment
  period: Year
  source: סעיף 121ב(א) ו־(א1)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: il/statute/income-tax-ordinance/section-121b
          excerpt: יחיד אשר הכנסתו החייבת בשנת המס עלתה על 640,000 שקלים חדשים
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: il/statute/income-tax-ordinance/section-121b
          excerpt: יחיד אשר הכנסתו החייבת ממקורות הוניים בשנת המס עלתה על הסכום הקבוע באותו סעיף קטן
  versions:
  - effective_from: '2025-01-01'
    formula: annual_taxable_income_ils > additional_tax_threshold_for_tax_year_ils or annual_taxable_income_from_capital_sources_ils
      > additional_tax_threshold_for_tax_year_ils
- name: additional_tax_ils
  kind: derived
  entity: Person
  dtype: Money
  unit: ILS
  period: Year
  source: 'סעיף 121ב(א) ו־(א1). הערה: אטומי ההוכחה מוכיחים את השיעורים ואת מבנה החיוב על העודף; הסכום
    המיושם הוא קלט מסופק, לא הסכום הנקוב בסעיף'
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: il/statute/income-tax-ordinance/section-121b
          excerpt: יהיה חייב במס נוסף על חלק הכנסתו החייבת העולה על 640,000 שקלים חדשים
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: il/statute/income-tax-ordinance/section-121b
          excerpt: בשיעור של 3%
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: il/statute/income-tax-ordinance/section-121b
          excerpt: יהיה חייב במס נוסף על חלק הכנסתו החייבת ממקורות הוניים העולה על הסכום האמור, בשיעור
            של 2%
  versions:
  - effective_from: '2025-01-01'
    formula: additional_tax_rate * max(0, annual_taxable_income_ils - additional_tax_threshold_for_tax_year_ils)
      + additional_tax_on_capital_income_rate * max(0, annual_taxable_income_from_capital_sources_ils
      - additional_tax_threshold_for_tax_year_ils)
