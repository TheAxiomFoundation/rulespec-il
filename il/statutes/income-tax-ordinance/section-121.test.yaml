- name: unacceptable_books_for_other_income_do_not_block_personal_exertion_rates
  period:
    period_kind: tax_year
    start: '2024-01-01'
    end: '2024-12-31'
  input:
    il:statutes/income-tax-ordinance/section-121#input.taxable_income: 600000
    il:statutes/income-tax-ordinance/section-121#input.taxable_income_from_personal_exertion: 300000
    il:statutes/income-tax-ordinance/section-121#input.individual_has_reached_age_sixty: false
    ? il:statutes/income-tax-ordinance/section-121#input.personal_exertion_taxable_income_requiring_books_without_acceptable_books
    : 0
    il:statutes/income-tax-ordinance/section-121#input.other_taxable_income_requiring_books_without_acceptable_books: 100000
  output:
    il:statutes/income-tax-ordinance/section-121#reduced_rate_taxable_income: 300000
    il:statutes/income-tax-ordinance/section-121#_general_income_band: 2
    il:statutes/income-tax-ordinance/section-121#_reduced_income_band: 3
    il:statutes/income-tax-ordinance/section-121#income_tax: 167030.4
- name: unacceptable_books_remove_only_the_affected_personal_exertion_income
  period:
    period_kind: tax_year
    start: '2024-01-01'
    end: '2024-12-31'
  input:
    il:statutes/income-tax-ordinance/section-121#input.taxable_income: 600000
    il:statutes/income-tax-ordinance/section-121#input.taxable_income_from_personal_exertion: 300000
    il:statutes/income-tax-ordinance/section-121#input.individual_has_reached_age_sixty: false
    ? il:statutes/income-tax-ordinance/section-121#input.personal_exertion_taxable_income_requiring_books_without_acceptable_books
    : 100000
    il:statutes/income-tax-ordinance/section-121#input.other_taxable_income_requiring_books_without_acceptable_books: 100000
  output:
    il:statutes/income-tax-ordinance/section-121#reduced_rate_taxable_income: 200000
    il:statutes/income-tax-ordinance/section-121#_general_income_band: 2
    il:statutes/income-tax-ordinance/section-121#_reduced_income_band: 2
    il:statutes/income-tax-ordinance/section-121#income_tax: 170110.4
- name: age_sixty_extends_reduced_rates_to_other_income_subject_to_books_exception
  period:
    period_kind: tax_year
    start: '2024-01-01'
    end: '2024-12-31'
  input:
    il:statutes/income-tax-ordinance/section-121#input.taxable_income: 600000
    il:statutes/income-tax-ordinance/section-121#input.taxable_income_from_personal_exertion: 300000
    il:statutes/income-tax-ordinance/section-121#input.individual_has_reached_age_sixty: true
    ? il:statutes/income-tax-ordinance/section-121#input.personal_exertion_taxable_income_requiring_books_without_acceptable_books
    : 100000
    il:statutes/income-tax-ordinance/section-121#input.other_taxable_income_requiring_books_without_acceptable_books: 100000
  output:
    il:statutes/income-tax-ordinance/section-121#reduced_rate_taxable_income: 400000
    il:statutes/income-tax-ordinance/section-121#_general_income_band: 2
    il:statutes/income-tax-ordinance/section-121#_reduced_income_band: -1
    il:statutes/income-tax-ordinance/section-121#income_tax: 167030.4
- name: other_income_below_age_sixty_uses_only_general_schedule
  period:
    period_kind: tax_year
    start: '2024-01-01'
    end: '2024-12-31'
  input:
    il:statutes/income-tax-ordinance/section-121#input.taxable_income: 600000
    il:statutes/income-tax-ordinance/section-121#input.taxable_income_from_personal_exertion: 0
    il:statutes/income-tax-ordinance/section-121#input.individual_has_reached_age_sixty: false
    ? il:statutes/income-tax-ordinance/section-121#input.personal_exertion_taxable_income_requiring_books_without_acceptable_books
    : 0
    il:statutes/income-tax-ordinance/section-121#input.other_taxable_income_requiring_books_without_acceptable_books: 0
  output:
    il:statutes/income-tax-ordinance/section-121#reduced_rate_taxable_income: 0
    il:statutes/income-tax-ordinance/section-121#_general_income_band: 2
    il:statutes/income-tax-ordinance/section-121#_reduced_income_band: 0
    il:statutes/income-tax-ordinance/section-121#income_tax: 202718.4
- name: auto_zero_general_income_band
  period:
    period_kind: tax_year
    start: '2026-01-01'
    end: '2026-12-31'
  input:
    il:statutes/income-tax-ordinance/section-121#input.individual_has_reached_age_sixty: false
    il:statutes/income-tax-ordinance/section-121#input.other_taxable_income_requiring_books_without_acceptable_books: 0
    ? il:statutes/income-tax-ordinance/section-121#input.personal_exertion_taxable_income_requiring_books_without_acceptable_books
    : 0
    il:statutes/income-tax-ordinance/section-121#input.taxable_income: 0
    il:statutes/income-tax-ordinance/section-121#input.taxable_income_from_personal_exertion: 0
  output:
    il:statutes/income-tax-ordinance/section-121#_general_income_band: 0
