
# Companion fixtures for ITO §121, the individual rate schedule.
#
# Every expected tax is the statutory schedule applied band by band, computed
# independently of the engine and shown here:
#
#   2025 earned income (§121(ב)(1) + §121(א)(2)-(3)):
#     10% to 84,120 | 14% to 120,720 | 20% to 193,800 | 31% to 269,280
#     | 35% to 560,280 | 47% above
#   2026 earned income (same, after ITO amendment 288 widened bands 3 and 4):
#     10% to 84,120 | 14% to 120,720 | 20% to 228,000 | 31% to 301,200
#     | 35% to 560,280 | 47% above
#   general schedule (§121(א), applied when the reduced rates do not):
#     31% to 269,280 (2025) / 301,200 (2026) | 35% to 560,280 | 47% above
#
# thirty_five_percent_band_upper_ils is SUPPLIED as 560,280 in every case. The
# current consolidation states it in §121(א)(2); the captured 2025 expression of
# that paragraph is defective ("מ־560,280 ... עד 542,160"), so it is not carried
# as a parameter. OECD TaxBEN's Israel 2025 description independently reports the
# 47% band as starting at 560,280.
#
# The 2025 band edges 84,120 / 120,720 / 193,800 / 269,280 / 560,280 match the
# OECD TaxBEN Israel 2025 description exactly. See docs/ENCODING-GAPS.md.

- name: minimum_wage_earner_is_taxed_only_in_the_ten_percent_band_2025
  period:
    period_kind: tax_year
    start: '2025-01-01'
    end: '2025-12-31'
  input:
    il:statutes/income-tax-ordinance/section-121#input.annual_taxable_income_ils: 70560.24
    il:statutes/income-tax-ordinance/section-121#input.income_is_from_personal_exertion_or_individual_is_60_or_over: true
    il:statutes/income-tax-ordinance/section-121#input.books_of_account_required_but_not_kept: false
    il:statutes/income-tax-ordinance/section-121#input.thirty_five_percent_band_upper_ils: 560280
  output:
    il:statutes/income-tax-ordinance/section-121#reduced_rates_apply: holds
    il:statutes/income-tax-ordinance/section-121#income_tax_before_credits_ils: 7056.024
