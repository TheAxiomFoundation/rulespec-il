
# Companion fixtures for ITO §34.
# Both truth values of the section's condition are exercised, as required.

- name: credit_is_allowed_when_the_condition_is_met
  period:
    period_kind: tax_year
    start: '2025-01-01'
    end: '2025-12-31'
  input:
    il:statutes/income-tax-ordinance/section-34#input.individual_meets_resident_credit_points_condition: true
  output:
    il:statutes/income-tax-ordinance/section-34#resident_credit_points: 2
    il:statutes/income-tax-ordinance/section-34#resident_credit_points_claimed: 2
- name: credit_is_zero_when_the_condition_is_not_met
  period:
    period_kind: tax_year
    start: '2025-01-01'
    end: '2025-12-31'
  input:
    il:statutes/income-tax-ordinance/section-34#input.individual_meets_resident_credit_points_condition: false
  output:
    il:statutes/income-tax-ordinance/section-34#resident_credit_points: 2
    il:statutes/income-tax-ordinance/section-34#resident_credit_points_claimed: 0
