
# Companion fixtures for ITO §33א. The credit point is a NOMINAL 504 ILS a year
# under §120א indexation; the current-year value is not in the statute and is
# not asserted here.

- name: nominal_credit_point_and_pension_point_divisor
  period:
    period_kind: tax_year
    start: '2025-01-01'
    end: '2025-12-31'
  input: {}
  output:
    il:statutes/income-tax-ordinance/section-33a#credit_point_nominal_annual_amount_ils: 504
    il:statutes/income-tax-ordinance/section-33a#pension_point_monthly_divisor: 12
    il:statutes/income-tax-ordinance/section-33a#credit_point_is_index_linked: true
