format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: il/statute/income-tax-ordinance/section-66
    source_sha256: 7b9a686f8137bcb32841697ac722f0bc5c59f1e8afb1c2d34784c9ea3cfcb52f
  summary: 'סעיף 66 לפקודת מס הכנסה — child credit points under separate calculation.


    §66 governs חישוב נפרד, the separate computation of tax on a spouse''s income

    from personal exertion. This module encodes only §66(ג)(4)(א) and §66(ג)(5) —

    the child credit points allowed to the woman and to the man against the tax on

    their income from personal exertion, by the child''s age band.


    THE MATURITY YEAR IS A CROSS-REFERENCE. §66(ג)(4)(א) defines ”שנת לידה“ and

    ”שנת בגרות“ by reference to §40(ב)(3), which is not encoded in this pilot, so

    the birth year and maturity year enter as the Boolean inputs

    `child_is_in_birth_year` and `child_is_in_maturity_year` rather than being

    derived from an age. The father''s schedule states no points for the maturity

    year, so the formula returns 0 there rather than inventing a parameter for an

    amount the statute does not state.


    SCOPE. §66(ג)(4)(א1) — the mother''s election to shift one of her birth-year

    points into the following tax year — is NOT encoded, and neither are

    §66(ג)(1)-(3), (4א), (5א) and (6), §66(א)-(ב) or §66(ד)-(ה). Neither is §40(ב), the single-parent
    schedule, nor §40(א)''s נקודות

    קיצבה, which the National Insurance Institute pays. A couple must elect

    separate calculation for this section to apply at all; the pilot''s composed

    fixtures take that election as given and say so.'
