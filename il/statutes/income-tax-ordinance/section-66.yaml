        kind: condition
        source:
          corpus_citation_path: il/statute/income-tax-ordinance/section-66
          excerpt: הגבר יהא זכאי, כנגד המס החל על הכנסתו מיגיעה אישית, לנקודות זיכוי בעד כל אחד מילדיו,
            כלהלן
  versions:
  - effective_from: '2012-01-01'
    formula: 'if child_is_in_birth_year: father_points_birth_year

      elif child_is_in_maturity_year: 0

      elif child_age_years <= 2: father_points_age_1_to_2

      elif child_age_years == 3: father_points_age_3

      elif child_age_years <= 5: father_points_age_4_to_5

      elif child_age_years <= 17: father_points_age_6_to_pre_maturity

      else: 0'
