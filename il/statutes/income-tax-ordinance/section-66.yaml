format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: il/statute/income-tax-ordinance/section-66
  summary: 'רשאי בן זוג שאיננו בן זוג רשום לתבוע כי ייעשה חישוב נפרד של המס על הכנסתו
    מיגיעה אישית בעסק או משלח יד או מעבודה

    אלה ההוראות שיחולו לגבי החישוב הנפרד:

    האשה תהא זכאית ל־1⁄2 נקודת זיכוי לפי סעיף 36א, ובנוסף וכנגד המס החל על הכנסתה
    מיגיעה אישית – לנקודות זיכוי בעד ילדיה כלהלן:

    הגבר יהא זכאי, כנגד המס החל על הכנסתו מיגיעה אישית, לנקודות זיכוי בעד כל אחד מילדיו,
    כלהלן:'
  deferred_outputs:
  - output: il:statutes/income-tax-ordinance/section-66/a/2#non_personal_exertion_income_allocation
    reason: Allocation requires identifying both spouses, comparing their personal-exertion
      taxable incomes, and coordinating property income separately calculated under
      subsection (b). No compatible spouse and income-allocation relation is supplied.
      The source supplies no tie-breaker for equal positive personal-exertion incomes.
  - output: il:statutes/income-tax-ordinance/section-66/a/3#child_income_attributed_to_registered_spouse
    reason: The age condition is executable. The amount additionally requires a relation
      connecting the registered spouse to that spouse's children and their transparent
      company, real-estate investment fund, interest and capital-gain income.
    source_values:
    - il:statutes/income-tax-ordinance/section-66#child_income_attribution_age_limit
  - output: il:statutes/income-tax-ordinance/section-66/b#separately_calculated_property_income
    reason: The property-owner and marriage-history relation, the income from each
      qualifying asset, and coordination with the same spouse's other separately calculated
      income are not supplied.
    source_values:
    - il:statutes/income-tax-ordinance/section-66#premarital_property_ownership_years
  - output: il:statutes/income-tax-ordinance/section-66/c/1#other_separate_calculation_deductions_and_reliefs
    reason: Sections 34 and 36 are composed below. Computing the remaining deductions,
      credits and reliefs requires the unavailable mechanics of sections 35, 45A,
      47, 47A, 121A, 10 and 11.
  - output: il:statutes/income-tax-ordinance/section-66/c/2#favored_individual_spouse_credit_points
    reason: Applying the half-point entitlement requires the favored-individual entitlement
      under section 37, which is not supplied.
    source_values:
    - il:statutes/income-tax-ordinance/section-66#favored_individual_separate_calculation_points
  - output: il:statutes/income-tax-ordinance/section-66/c/3#registered_spouse_pension_points
    reason: Only the registered spouse may receive the section 40(a) pension points.
      Computing those points requires the unavailable section 40(a) entitlement.
  - output: il:statutes/income-tax-ordinance/section-66/c/4#woman_additional_credit_points
    reason: The half-point figure is retained. Applying the referenced section 36A
      entitlement requires that provision's unavailable mechanics.
    source_values:
    - il:statutes/income-tax-ordinance/section-66#woman_separate_calculation_additional_points
  - output: il:statutes/income-tax-ordinance/section-66/c/4/a#child_birth_and_maturity_year_classification
    reason: Section 40(b)(3) supplies the definitions of birth year and maturity year.
      The schedules below consume those classifications as child-level boundary facts
      and do not infer a maturity year from an invented age.
  - output: il:statutes/income-tax-ordinance/section-66/c/4/a1#mother_child_points_after_birth_year_election
    reason: The schedules below are explicitly before the mother's election. Applying
      the election requires connecting the same mother and child across the birth
      year and following tax year, including the prior election.
    source_values:
    - il:statutes/income-tax-ordinance/section-66#mother_birth_year_deferrable_points
  - output: il:statutes/income-tax-ordinance/section-66/c#separate_calculation_parent_child_credit_points
    reason: Parent totals require child-parent relations, the special treatment of
      children of a deceased spouse under paragraphs (4A) and (6), the mother's election,
      and application against the recipient's personal-exertion income tax. The executable
      per-child schedules are not parent totals or monetary tax credits.
imports:
- il:statutes/income-tax-ordinance/section-34#tax_credit_points_for_israeli_resident
- il:statutes/income-tax-ordinance/section-36#tax_credit_points_for_travel
