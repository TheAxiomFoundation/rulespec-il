- name: mother_child_credit_points
  kind: derived
  entity: Person
  dtype: Decimal
  period: Year
  source: סעיף 66(ג)(4)(א)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: il/statute/income-tax-ordinance/section-66
          excerpt: האשה תהא זכאית ל־1⁄2 נקודת זיכוי לפי סעיף 36א, ובנוסף וכנגד המס החל על הכנסתה מיגיעה
            אישית – לנקודות זיכוי בעד ילדיה כלהלן
  versions:
  - effective_from: '2012-01-01'
    formula: 'if child_is_in_birth_year: mother_points_birth_year

      elif child_is_in_maturity_year: mother_points_maturity_year

      elif child_age_years <= 2: mother_points_age_1_to_2

      elif child_age_years == 3: mother_points_age_3

      elif child_age_years <= 5: mother_points_age_4_to_5

      elif child_age_years <= 17: mother_points_age_6_to_pre_maturity

      else: 0'
