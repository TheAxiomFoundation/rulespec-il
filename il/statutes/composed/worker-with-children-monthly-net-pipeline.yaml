module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: il/statute/income-tax-ordinance
  summary: |-
    Composed monthly net income for an employed parent with children.

    THIS FILE IS ASSEMBLED, NOT ENCODED, and it is the only file in the repository
    that is. There is no machine-readable marker saying so, and that is not an oversight:
    `module.kind: composition` is rejected by the engine on this surface — "atomic RuleSpec
    module ... must not declare module.kind; `composition` is accepted only by the
    composed-program surface" — so the guard's report that this file and its companion have
    no apply manifest is the only signal, and it is the correct one. Both are listed in
    docs/ENCODING-GAPS.md, `composition-has-no-machine-readable-assembled-marker`. Every atomic module under il/statutes/income-tax-ordinance/,
    il/statutes/national-insurance-law-1995/ and il/statutes/national-health-insurance-law-1994/
    was produced by the supervised encoder
    and carries an apply manifest under .axiom/encoding-manifests/. A composition
    declares imports of those encoded rules and the wiring between them. It states one
    statutory quantity of its own, and only one: the age 18 in NII §65(א)'s definition of
    ”ילד“, written out as `child_N_age_at_month_years < national_insurance_child_age_limit_years`
    (the 18 of §65(א), a named parameter here). It is here rather than in an encoded
    module because the test has to be asked once per child and this pilot declares no
    Child entity, so §65 has no single-answer shape an atomic module could take. §65 IS in
    the corpus and IS encodable; not encoding it is a limitation of this pilot's entity
    model, not of the source. The condition carries a verbatim proof atom against the
    provision. See docs/ENCODING-GAPS.md, `nii-section-65-child-definition-partial`.

    ITS corpus_citation_path IS AN INSTRUMENT, NOT A PROVISION. Each atomic module
    anchors to one provision. This one composes across three instruments, so no single
    provision is "its" source; the declared path is the instrument-level one, matching
    the rulespec-dk composed precedent, and every proof atom in it carries its own
    section-level citation path instead. Verification runs atom by atom. No module here
    declares a source_sha256 at all — the encoder writes a citation path and no digest
    when it resolves out of a corpus checkout rather than a signed release, and no
    il-rulespec release exists yet. See docs/ENCODING-GAPS.md, `no-source-sha256-pins`.

    WHAT IT WIRES:

      gross monthly wage
        -> x12 -> ITO §121 income_tax, which applies the §121(ב)(1) reduced rates to
           the personal-exertion PART of the income rather than switching the whole
           schedule on a person-level flag
        -> less the credit-point value times §34 + §36 + §36א + the §66(ג)(4)-(5)
           child points
        -> plus the §121ב additional tax on the same annual figure
        -> plus the National Insurance child allowance, paid for each child in the
           parent's count, where a child is one who is in Israel and has not reached
           18 — NII §65(א) — which is a NARROWER test than the ITO §66(ג) credit-point
           ladder applies, and a different one

    TWO AGES PER CHILD, BECAUSE THE TWO INSTRUMENTS ASK DIFFERENT QUESTIONS. ITO §66(ג)
    grants credit points by the age a child ATTAINS in the tax year (the year it turns
    three, the years it turns four and five, …), so `child_N_age_years` is the age the
    child reaches during the tax year. NII §65(א) asks, month by month, whether the child
    has not yet reached 18, so `child_N_age_at_month_years` is the child's age at the
    allowance month. They differ around a birthday: a child who is two at the month and
    turns three later in the year draws the year-turning-three points (3.5 for a mother),
    not the 4.5 of the year after birth through age two; a child who turns eighteen later
    in the year still counts for the allowance in the months before the birthday and stops
    counting after it, while ITO §66 grants the maturity-year half point either way.
        -> which §66 of that Law denies outright to a parent liable to the §121ב
           additional tax
        = monthly net
        -> less the NII §342(ג)(1) employee deduction and the National Health Insurance
           Law §14 contribution, both on the wage up to the לוח י״א maximum
        = monthly take-home pay before pension contributions

    THE WAGE IS §2(2) INCOME. ITO §121ב(ה) defines the capital-source base by excluding
    (1) `הכנסה לפי סעיף 2(1) או (2)` and (2) personal-exertion income that is not within
    (1). A salary is `השתכרות או ריווח מעבודה` — ITO §2(2)(א) — so the whole of this
    pipeline's income belongs in the FIRST category, and
    taxable_income_from_personal_exertion_not_under_section_2_1_or_2 is zero. Both
    categories are subtracted identically by §121ב, so nothing computed here changes;
    what changes is that the classification now says what the Ordinance says.

    THE COUPLING IS DERIVED, NOT SUPPLIED. `taxable_income_for_section_121b` is
    derived here from the monthly wage, ITO §121ב computes `total_additional_tax` from
    it, and `insured_parent_has_income_subject_to_additional_tax_under_section_121b` —
    the fact NII §66 excludes on — is derived from that tax being positive. The
    compiler's evaluation_order puts the derivation before NII §66's judgment. One
    fact, derived once, consumed by both instruments. Nothing here maintains a flag.

    READ THAT COUPLING CAREFULLY. The OECD TaxBEN Israel description says the child
    allowance "is not means-tested", which cannot be reconciled with §66's exclusion
    of a parent liable to the §121ב additional tax. Nothing captured resolves it —
    whether the exclusion was ever brought into force or is administered differently
    cannot be determined from the snapshots. This pipeline computes what the captured
    statutory text says; it is NOT a verified description of what the National
    Insurance Institute pays, and must not be presented as one. See
    docs/ENCODING-GAPS.md, `child-allowance-surtax-exclusion-vs-oecd`.

    SUPPLIED VALUES, AND WHY. Three quantities are inputs rather than parameters,
    because the statute states them as nominal amounts under an indexation mechanism
    this repository does not implement:
      * credit_point_value_for_tax_year_ils — ITO §33א states 504 ILS nominal.
      * current_basic_amount_first_and_fifth_plus_ils and
        current_basic_amount_second_third_fourth_ils — NII §1(2) states 150 and 188
        nominal. Both nominal figures ARE encoded, imported here, and reported as
        `statutory_nominal_monthly_child_allowance_ils` beside the supplied figure, so
        the gap between the statute's text and the amount paid is visible rather than
        silently closed.
    The §121ב threshold is NOT in that category: this pipeline applies the statute's
    own 640,000 ILS, the figure ITO §121ב prints, not an indexed current-year figure.
    That is a narrower claim than the hand-authored predecessor made, and a safer one.
    Each fixture records where its supplied number came from. None is law as stated here.

    THE EARLIEST PERIOD THIS PIPELINE CAN ANSWER IS 2026-01. Its own versions say
    `effective_from: '2026-01-01'` because ITO §121's do. Read precisely: ס״ח 3511 פרק ג׳ §5
    replaces FOUR figures — §121(א)(1)'s amount with 301,200, §121(א)(2) with
    `מ־301,201 ... עד 560,280 ... 35%`, §121(ב)(1)(ג)'s upper edge with 228,000, and
    §121(ב)(1)(ד) with `מ־228,001 ... עד 301,200 ... 31%`. It does NOT touch 84,120,
    120,720, or the 10/14/20/47% rates, which are older text. What dates the whole schedule
    to 2026-01-01 is that this repository holds ONE expression of §121, the post-288 one,
    and §6 commences that act — `תחילתו של פרק זה ביום י״ב בטבת התשפ״ו (1 בינואר 2026)`. The 2025 schedule is a
    different text and is not in this repository's corpus, so an earlier request finds no
    version in force rather than being answered with the wrong year's law. See
    docs/ENCODING-GAPS.md, `corpus-holds-one-expression-per-provision`.

    BOUNDS. At most two children; one earner, an adult resident employee under 65 who receives
    no National Insurance benefit; separate calculation (חישוב נפרד) assumed
    elected, which is what makes §66(ג)(4)-(5) apply. Both ladders are carried and
    selected by taxpayer_is_a_woman, because §66(ג)(4)(א) and §66(ג)(5) diverge from age
    six (two points against one) and in the maturity year (half a point against none).
    child_1_credit_points_under_section_66_schedule and child_2_credit_points_under_section_66_schedule repeat the age-band selection
    because the pilot declares no Child entity and uses no relation aggregation, and
    because §66's own selector reads a parameter table that can be indexed only once per
    person per period; the right shape is a Child entity with sum(children.credit_points),
    which is out of scope here. Every point VALUE is imported from the §66 module — none
    is retyped in this file.

    TWO SEPARATE AGE TESTS, ON PURPOSE. The annual ITO §66(ג) credit-point ladder and the
    monthly NII child allowance are different instruments with different age rules, and
    this pipeline keeps them apart:
      * child_N_credit_points reads the §66(ג)(4)-(5) age bands, which run to the maturity
        year and stop.
      * child_N_is_a_child_under_section_65 asks the National Insurance question instead —
        NII §65(א) defines ”ילד“ for the whole child-allowance chapter and admits one only
        `ובלבד שהילד נמצא בישראל ולא מלאו לו 18 שנים`. children_in_parent_child_count is the
        number of the parent's children that survive that test, and it — not
        number_of_children — is what the §68(א)/§1(2) birth-order amounts are read against.
    So a 19-year-old, or a child in its maturity year that has already turned 18, carries
    whatever the tax ladder gives it and is OUTSIDE the allowance count; and when the elder
    child drops out, the younger one becomes the FIRST child in the count and draws the
    first-child amount, which is what §1(2)(א) keys on ("בעד הילד הראשון והחמישי ואילך
    במניין ילדיו של ההורה"). Both age facts are supplied per child, for the same reason the
    credit-point ladder is repeated per child: the pilot declares no Child entity.

    WHAT §65 THIS PIPELINE DOES NOT APPLY. §65(א)'s own definition of ”ילד“ also reaches
    a child the insured maintains without being its parent, on conditions set in
    regulations that are not in the corpus; and §65(ב) treats a child out of Israel for up
    to three months as still in Israel, and lets the Institute extend that. Neither is
    modelled: child_N_is_present_in_israel is taken as given for the month. See
    docs/ENCODING-GAPS.md, `nii-section-65-child-definition-partial`.

    It wires NII §66 (entitlement), §65(א)'s age and presence test, and the §68(א)/§1(2)
    birth-order structure; it does NOT wire NII §67 (which of two parents holds the count)
    or §68(ב)/(ג) — the capstone assumes every counted child falls in THIS parent's count,
    and no fixture is on income support or has a child born before June 2003. §67 and §68
    are encoded and tested in their own modules.

    Annual tax is divided by twelve for presentation; this is not a model of the monthly
    ניכוי במקור deduction rules, which are not encoded. `monthly_net_income_ils` is net of
    income tax and inclusive of child allowance only, as it always was. It is not take-home pay.

    TAKE-HOME PAY BEFORE PENSION CONTRIBUTIONS.
    `monthly_take_home_pay_before_pension_contributions_ils` further deducts the employee's two
    statutory contributions:
      * health insurance, `employee_health_insurance_contribution_for_month`, imported from the
        encoded National Health Insurance Law §14: 3.23% up to the §341 reduced amount (§14(ו1))
        and 5.17% above it (§14(ב)(1));
      * National Insurance, `employee_national_insurance_deduction_for_month`, which THIS FILE
        computes. NII §342(ג)(1) says the employer deducts the לוח י׳ percentages from the wage;
        the encoder deferred that output in every round (docs/ENCODING-GAPS.md,
        `nii-section-342-c-1-applied-in-the-composition`), so the composition applies it, the
        way it applies §68(א)'s per-child amounts: the לוח י׳ טור ד׳ totals are IMPORTED from the
        encoded table (1.04% up to the bracket and 7% above it in 2025–2026), on the income after
        the encoded §348 maximum. No rate, bracket or ceiling is stated here. §342(ג)(2)'s
        cessations (an old-age pension; a man at 70; a woman at her Schedule A1 Part D age, 65 at
        the lowest) cannot reach the person this pipeline models, who is under 65 and draws no
        pension; that is a bound, not a rule applied.
    Both are levied on the wage after NII §348(א)'s maximum, which is לוח י״א פרט 1: five times
    basic amount 3. The health law reaches that ceiling through its own §2 definition of
    ”הכנסה“ and §15(ב). The reduced collection bracket and basic amount 3 are supplied, like
    the credit-point value and the child-allowance amounts, and ONE bracket figure feeds both
    contributions (see docs/ENCODING-GAPS.md, `contributions-bracket-and-ceiling-are-supplied`).
    A payslip usually also deducts an employee pension contribution. No encoded law imposes
    it, and this pipeline does not deduct it; the output's name says so.

    Every fact the health module asks about is bound here. The person's residency and age in
    the month come from inputs. Every exemption, pension route and special category the module
    can switch on is bound to false, each with a proof atom naming the provision it switches
    off. The age in the month, `taxpayer_age_at_month_years`, sits beside
    `taxpayer_is_at_least_60_years_old` for the reason each child has two ages: ITO §121(ב)(1)
    asks whether the person reached 60 in the TAX YEAR, and health §14(ז) asks the person's age
    in the MONTH. See docs/ENCODING-GAPS.md, `contributions-scope-of-the-composed-person`.
