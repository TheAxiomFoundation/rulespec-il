module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: il/statute/income-tax-ordinance
  summary: "Composed monthly net income for an employed parent with children.\n\nNO MODULE-LEVEL source_sha256,\
    \ and that is deliberate. The other thirteen\nmodules each anchor to one provision and carry that\
    \ provision's hash. This one\ncomposes across two instruments, so no single provision is \"its\" source\
    \ and the\nhash of a directory would mean nothing. Its declared\n`corpus_citation_path` is the instrument-level\
    \ path, matching the rulespec-dk\ncomposed precedent, and every proof atom in it carries its own section-level\n\
    citation path instead. Verification therefore runs atom by atom.\n\nWires the pilot's two instruments\
    \ into one figure a reader can check:\n\n  gross monthly wage\n    -> §121 income tax on annual taxable\
    \ income (reduced schedule, יגיעה אישית)\n    -> less the §33א credit-point value times the §34 +\
    \ §36 + §36א + §66(ג)(4)\n       credit points\n    -> plus the §121ב additional tax\n    -> plus\
    \ the National Insurance child allowance, which §66 of that Law\n       denies outright to a parent\
    \ liable to the §121ב additional tax\n    = monthly net\n\nThat last link is the point of the capstone:\
    \ in the captured statutory text the\nbenefit is not independent of the tax. A fixture drives income\
    \ past the\nadditional-tax threshold and the allowance goes to zero for a reason written in\nNII §66,\
    \ not one modelled here.\n\nREAD THAT FIXTURE CAREFULLY. The OECD TaxBEN Israel description says the\
    \ child\nallowance \"is not means-tested\", which cannot be reconciled with §66's exclusion\nof a\
    \ parent liable to the §121ב additional tax. Nothing captured resolves it —\nwhether the exclusion\
    \ was ever brought into force or is administered differently\ncannot be determined from the snapshots.\
    \ The capstone encodes what the statutory\ntext says; it is NOT a verified description of what the\
    \ National Insurance\nInstitute pays, and must not be presented as one. See docs/ENCODING-GAPS.md,\n\
    `child-allowance-surtax-exclusion-vs-oecd`.\n\nSUPPLIED VALUES, AND WHY. Three quantities are inputs\
    \ rather than parameters,\nbecause the statute states them as nominal amounts under an indexation\n\
    mechanism this repository does not implement and no official current-year\ncapture exists:\n  * `credit_point_value_for_tax_year_ils`\
    \ — §33א states 504 ILS nominal.\n  * `additional_tax_threshold_for_tax_year_ils` (on the §121ב module)\
    \ — §121ב\n    states 640,000 ILS nominal.\n  * `current_basic_amount_*` (on the §68 module) — §1\
    \ states 150/188/140 nominal.\nEach fixture records where its supplied number came from. None of them\
    \ is law\nas stated here.\n\nHOW THE COUPLING IS WIRED. `monthly_child_allowance_ils` gates on the\
    \ IMPORTED\n§121ב judgment `liable_to_additional_tax`, which is itself derived from the\nsupplied\
    \ annual income and threshold. The exclusion therefore follows from\nincome through §121ב, not from\
    \ a fixture-maintained flag. NII §66's own\n`entitled_to_child_allowance` is imported as well and\
    \ carries the insurance\ncondition.\n\nBOUNDS. At most two children; one earner; separate calculation\
    \ (חישוב נפרד)\nassumed elected, which is what makes §66(ג)(4)-(5) apply. Both ladders are\ncarried\
    \ and selected by `taxpayer_is_a_woman`, because §66(ג)(4)(א) and\n§66(ג)(5) diverge from age six\
    \ (two points against one) and in the maturity year\n(half a point against none). It wires NII §66\
    \ (entitlement) and the\n§68(א)/§1(2) birth-order structure;\nit does NOT wire NII §67 (whose count\
    \ a child falls into) or §68(ב)/(ג) — the\ncapstone assumes both children fall in this parent's count,\
    \ and no fixture there\nis on income support or has a child born before June 2003. §67 and §68 are\n\
    encoded and tested in their own modules. `child_1_credit_points` and `child_2_credit_points` repeat\
    \ the §66 age-band\nselection because the pilot has no Child entity and no relation aggregation —\n\
    the right shape is a Child entity with `sum(children.credit_points)`, and that is\nout of scope here.\
    \ Annual tax is divided by twelve for presentation; this is not\na model of the monthly ניכוי במקור\
    \ deduction rules, which are not encoded.\n\nTHE EMPLOYEE’S CONTRIBUTIONS ARE NOW DEDUCTED. An earlier revision of this capstone said they were not, and that this \"net\" was net of income tax only. It now subtracts the employee’s national insurance contribution, from the סך הכל row of לוח י׳ (1.04% on the part of the wage up to the reduced-collection step, 7% above it), and the employee’s health insurance contribution, from §14(ו1) and §14(ב)(1) of the National Health Insurance Law (3.23% and 5.17% on the same two bands). Both are capped by NII §348(א).\n\nIT IS STILL NOT TAKE-HOME PAY, and must not be presented as such. The employER’s contributions are not modelled, because they are not the employee’s money. Neither the pension-contribution credit nor מס הכנסה שלילי (EITC) nor any other instrument is encoded. The two contribution thresholds are supplied inputs taken from the Institute’s published table, because neither the Law nor NII §341 states an amount. Annual tax is still divided by twelve for presentation and is not a model of the monthly ניכוי במקור rules. See docs/ENCODING-GAPS.md."
rules:
- name: child_1_credit_points
  kind: derived
  entity: Person
  dtype: Decimal
  period: Month
  source: סעיף 66(ג)(4)(א) לפקודה
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: il/statute/income-tax-ordinance/section-66
          excerpt: לנקודות זיכוי בעד ילדיה כלהלן
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: il/statute/income-tax-ordinance/section-66
          excerpt: הגבר יהא זכאי, כנגד המס החל על הכנסתו מיגיעה אישית, לנקודות זיכוי בעד כל אחד מילדיו,
            כלהלן
  versions:
  - effective_from: '2025-01-01'
    formula: "if number_of_children < 1: 0\nelif child_1_is_in_birth_year:\n  (if taxpayer_is_a_woman:\
      \ mother_points_birth_year else: father_points_birth_year)\nelif child_1_is_in_maturity_year:\n\
      \  (if taxpayer_is_a_woman: mother_points_maturity_year else: 0)\nelif child_1_age_years <= 2:\n\
      \  (if taxpayer_is_a_woman: mother_points_age_1_to_2 else: father_points_age_1_to_2)\nelif child_1_age_years\
      \ == 3:\n  (if taxpayer_is_a_woman: mother_points_age_3 else: father_points_age_3)\nelif child_1_age_years\
      \ <= 5:\n  (if taxpayer_is_a_woman: mother_points_age_4_to_5 else: father_points_age_4_to_5)\nelif\
      \ child_1_age_years <= 17:\n  (if taxpayer_is_a_woman: mother_points_age_6_to_pre_maturity\n   else:\
      \ father_points_age_6_to_pre_maturity)\nelse: 0"
