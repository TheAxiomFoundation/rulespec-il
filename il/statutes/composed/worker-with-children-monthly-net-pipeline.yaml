        source:
          corpus_citation_path: il/statute/national-insurance-law-1995/section-66
          excerpt: למעט הורה מבוטח שיש לו הכנסה החייבת במס נוסף כמשמעותה בסעיף 121ב לפקודת מס הכנסה
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: il/statute/national-insurance-law-1995/section-68
          excerpt: קצבת הילדים לחודש בעד כל ילד שבמנין ילדיו של ההורה תהיה בסכום השווה לסכום הבסיסי הקבוע
