  kind: parameter
  dtype: Integer
  period: Year
  source: הרכבה — שנת המס היא תקופה של שנים עשר חדשים רצופים (סעיף 1 לפקודה); המקדם שבו מוכפל שכר חודשי לשנה ומחולק מס שנתי לחודש
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: il/statute/income-tax-ordinance/section-1
          excerpt: תקופה של שנים עשר חדשים רצופים, שתחילתה ב־1 בינואר
  versions:
  - effective_from: '2026-01-01'
    formula: '12'
- name: taxable_income
  kind: derived
  entity: Person
  dtype: Money
  unit: ILS
  period: Year
  source: הרכבה — הכנסה חייבת שנתית לצורך סעיף 121 לפקודה
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: il/statute/income-tax-ordinance/section-121
          excerpt: המס על הכנסתו החייבת של יחיד בשנת המס יהיה כלהלן
  versions:
  - effective_from: '2026-01-01'
    formula: max(0, monthly_gross_wage_ils * months_in_tax_year)
