  versions:
  - effective_from: '2025-01-01'
    formula: taxpayer_is_an_insured_parent
- name: child_1_credit_points
  kind: derived
  entity: Person
  dtype: Decimal
  period: Year
  source: סעיפים 66(ג)(4)(א) ו־66(ג)(5) לפקודה
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: il/statute/income-tax-ordinance/section-66
          excerpt: לנקודות זיכוי בעד ילדיה כלהלן
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: il/statute/income-tax-ordinance/section-66
          excerpt: הגבר יהא זכאי, כנגד המס החל על הכנסתו מיגיעה אישית, לנקודות זיכוי בעד כל אחד מילדיו, כלהלן
  versions:
  - effective_from: '2025-01-01'
    formula: |-
      if number_of_children < 1: 0
      elif child_1_is_in_birth_year:
        (if taxpayer_is_a_woman: woman_credit_points_birth_year else: man_credit_points_birth_year)
      elif child_1_is_in_maturity_year:
        (if taxpayer_is_a_woman: woman_credit_points_maturity_year else: 0)
      elif child_1_age_years <= 2:
        (if taxpayer_is_a_woman: woman_credit_points_year_after_birth_through_age_two else: man_credit_points_year_after_birth_through_age_two)
      elif child_1_age_years == 3:
        (if taxpayer_is_a_woman: woman_credit_points_year_turning_three else: man_credit_points_year_turning_three)
      elif child_1_age_years <= 5:
        (if taxpayer_is_a_woman: woman_credit_points_years_turning_four_and_five else: man_credit_points_years_turning_four_and_five)
      elif child_1_age_years <= 17:
        (if taxpayer_is_a_woman: woman_credit_points_from_age_six_until_maturity_year else: man_credit_points_from_age_six_until_maturity_year)
      else: 0
- name: child_2_credit_points
  kind: derived
  entity: Person
  dtype: Decimal
  period: Year
  source: סעיפים 66(ג)(4)(א) ו־66(ג)(5) לפקודה
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: il/statute/income-tax-ordinance/section-66
          excerpt: לנקודות זיכוי בעד ילדיה כלהלן
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: il/statute/income-tax-ordinance/section-66
          excerpt: הגבר יהא זכאי, כנגד המס החל על הכנסתו מיגיעה אישית, לנקודות זיכוי בעד כל אחד מילדיו, כלהלן
  versions:
  - effective_from: '2025-01-01'
    formula: |-
      if number_of_children < 2: 0
      elif child_2_is_in_birth_year:
        (if taxpayer_is_a_woman: woman_credit_points_birth_year else: man_credit_points_birth_year)
      elif child_2_is_in_maturity_year:
        (if taxpayer_is_a_woman: woman_credit_points_maturity_year else: 0)
      elif child_2_age_years <= 2:
        (if taxpayer_is_a_woman: woman_credit_points_year_after_birth_through_age_two else: man_credit_points_year_after_birth_through_age_two)
      elif child_2_age_years == 3:
        (if taxpayer_is_a_woman: woman_credit_points_year_turning_three else: man_credit_points_year_turning_three)
      elif child_2_age_years <= 5:
        (if taxpayer_is_a_woman: woman_credit_points_years_turning_four_and_five else: man_credit_points_years_turning_four_and_five)
      elif child_2_age_years <= 17:
        (if taxpayer_is_a_woman: woman_credit_points_from_age_six_until_maturity_year else: man_credit_points_from_age_six_until_maturity_year)
      else: 0
- name: annual_credit_points
  kind: derived
  entity: Person
  dtype: Decimal
  period: Year
  source: סעיפים 34, 36, 36א ו־66(ג) לפקודה
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: il/statute/income-tax-ordinance/section-34
          excerpt: יובאו בחשבון שתי נקודות זיכוי
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: il/statute/income-tax-ordinance/section-36
          excerpt: תובא בחשבון 1⁄4 נקודת זיכוי כזיכוי נסיעה
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: il/statute/income-tax-ordinance/section-36a
          excerpt: בחישוב המס של אשה תובא בחשבון 1⁄2 נקודת זיכוי
  versions:
  - effective_from: '2025-01-01'
    formula: |-
      tax_credit_points_for_israeli_resident
      + tax_credit_points_for_travel
      + tax_credit_points_for_woman
      + child_1_credit_points
      + child_2_credit_points
- name: annual_credit_amount_ils
  kind: derived
  entity: Person
  dtype: Money
  unit: ILS
  period: Year
  source: סעיף 33א לפקודה
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: il/statute/income-tax-ordinance/section-33a
          excerpt: סכום של 504 שקלים חדשים לשנת מס, צמוד למדד כאמור בסעיף 120א, המקוזז כנגד המס לאותה שנה
  versions:
  - effective_from: '2025-01-01'
    formula: annual_credit_points * credit_point_value_for_tax_year_ils
- name: annual_income_tax_after_credits_ils
  kind: derived
  entity: Person
  dtype: Money
  unit: ILS
  period: Year
  source: סעיפים 121, 121ב ו־33א לפקודה
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: ordering
        source:
          corpus_citation_path: il/statute/income-tax-ordinance/section-33a
          excerpt: המקוזז כנגד המס לאותה שנה
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: il/statute/income-tax-ordinance/section-121b
          excerpt: על חלק הכנסתו החייבת העולה על 640,000 שקלים חדשים
  versions:
  - effective_from: '2025-01-01'
    formula: max(0, income_tax - annual_credit_amount_ils) + total_additional_tax
- name: monthly_child_allowance_ils
  kind: derived
  entity: Person
  dtype: Money
  unit: ILS
  period: Month
  source: סעיף 66 וסעיף 68(א) לחוק הביטוח הלאומי, עם הסכומים המפורסמים לשנת המס
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: il/statute/national-insurance-law-1995/section-66
          excerpt: למעט הורה מבוטח שיש לו הכנסה החייבת במס נוסף כמשמעותה בסעיף 121ב לפקודת מס הכנסה
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: il/statute/national-insurance-law-1995/section-68
          excerpt: קצבת הילדים לחודש בעד כל ילד שבמנין ילדיו של ההורה תהיה בסכום השווה לסכום הבסיסי הקבוע לגביו
  versions:
  - effective_from: '2025-01-01'
    formula: |-
      if insured_parent_eligible_for_monthly_child_allowance:
        (if number_of_children >= 1: current_basic_amount_first_and_fifth_plus_ils else: 0)
        + (if number_of_children >= 2: current_basic_amount_second_third_fourth_ils else: 0)
      else: 0
- name: statutory_nominal_monthly_child_allowance_ils
  kind: derived
  entity: Person
  dtype: Money
  unit: ILS
  period: Month
  source: סעיף 68(א) לחוק הביטוח הלאומי עם הסכומים הנקובים בפסקה (2) להגדרת ”הסכום הבסיסי“ שבסעיף 1
  metadata:
    proof:
