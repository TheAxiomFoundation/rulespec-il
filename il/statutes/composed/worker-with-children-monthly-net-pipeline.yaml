          excerpt: לנקודות זיכוי בעד ילדיה כלהלן
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: il/statute/income-tax-ordinance/section-66
          excerpt: הגבר יהא זכאי, כנגד המס החל על הכנסתו מיגיעה אישית, לנקודות זיכוי בעד כל אחד מילדיו, כלהלן
  versions:
  - effective_from: '2026-01-01'
    formula: |-
      if number_of_children < 1: 0
      elif child_1_is_in_birth_year:
        (if taxpayer_is_a_woman: woman_credit_points_birth_year else: man_credit_points_birth_year)
      elif child_1_is_in_maturity_year:
        (if taxpayer_is_a_woman: woman_credit_points_maturity_year else: 0)
      elif child_1_age_years <= 2:
        (if taxpayer_is_a_woman: woman_credit_points_year_after_birth_through_age_two else: man_credit_points_year_after_birth_through_age_two)
      elif child_1_age_years == 3:
        (if taxpayer_is_a_woman: woman_credit_points_year_turning_three else: man_credit_points_year_turning_three)
      elif child_1_age_years <= credit_point_age_band_four_and_five_upper_age_years:
        (if taxpayer_is_a_woman: woman_credit_points_years_turning_four_and_five else: man_credit_points_years_turning_four_and_five)
      elif child_1_age_years < child_maturity_age_years:
        (if taxpayer_is_a_woman: woman_credit_points_from_age_six_until_maturity_year else: man_credit_points_from_age_six_until_maturity_year)
      else: 0
