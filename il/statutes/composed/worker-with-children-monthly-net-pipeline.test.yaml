- name: high_earner_mother_two_children_sixty_thousand_a_month
  # The point of the whole pipeline. 720,000 a year crosses the 640,000 ILS that
  # ITO §121ב prints, so the additional tax is 3% x 80,000 = 2,400 — and NII §66 excludes an
  # insured parent with income liable to that tax from the child allowance outright. The
  # allowance goes to zero because of a provision in the National Insurance Law, computed
  # from income through the Income Tax Ordinance. Nothing here models it; the captured
  # statutory text says it. Read docs/ENCODING-GAPS.md,
  # `child-allowance-surtax-exclusion-vs-oecd`, before showing this to anyone.
  period:
    period_kind: month
    start: '2026-01-01'
    end: '2026-12-31'
  input:
    il:statutes/composed/worker-with-children-monthly-net-pipeline#input.monthly_gross_wage_ils: 60000
    il:statutes/composed/worker-with-children-monthly-net-pipeline#input.number_of_children: 2
    il:statutes/composed/worker-with-children-monthly-net-pipeline#input.taxpayer_is_a_woman: true
    il:statutes/composed/worker-with-children-monthly-net-pipeline#input.taxpayer_is_israeli_resident: true
    il:statutes/composed/worker-with-children-monthly-net-pipeline#input.taxpayer_is_an_insured_parent: true
    il:statutes/composed/worker-with-children-monthly-net-pipeline#input.taxpayer_is_at_least_60_years_old: false
    il:statutes/composed/worker-with-children-monthly-net-pipeline#input.books_of_account_required_but_not_kept: false
    il:statutes/composed/worker-with-children-monthly-net-pipeline#input.credit_point_value_for_tax_year_ils: 2904
    il:statutes/composed/worker-with-children-monthly-net-pipeline#input.current_basic_amount_first_and_fifth_plus_ils: 173
    il:statutes/composed/worker-with-children-monthly-net-pipeline#input.current_basic_amount_second_third_fourth_ils: 219
