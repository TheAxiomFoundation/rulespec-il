    il:statutes/composed/worker-with-children-monthly-net-pipeline#input.child_2_is_in_maturity_year: false
  output:
    il:statutes/income-tax-ordinance/section-121#income_tax: 25392.0
    il:statutes/income-tax-ordinance/section-121b#total_additional_tax: 0.0
    il:statutes/income-tax-ordinance/section-34#tax_credit_points_for_israeli_resident: 2
    il:statutes/income-tax-ordinance/section-36#tax_credit_points_for_travel: 0.25
    il:statutes/national-insurance-law-1995/section-1#child_allowance_first_and_fifth_onward_base_amount: 150
    il:statutes/national-insurance-law-1995/section-1#child_allowance_second_third_and_fourth_base_amount: 188
    il:statutes/national-insurance-law-1995/section-66#insured_parent_eligible_for_monthly_child_allowance: holds
    il:statutes/composed/worker-with-children-monthly-net-pipeline#child_1_credit_points: 4.5
    il:statutes/composed/worker-with-children-monthly-net-pipeline#child_2_credit_points: 2
    il:statutes/composed/worker-with-children-monthly-net-pipeline#annual_credit_points: 9.25
    il:statutes/composed/worker-with-children-monthly-net-pipeline#annual_credit_amount_ils: 26862.0
    il:statutes/composed/worker-with-children-monthly-net-pipeline#annual_income_tax_after_credits_ils: 0.0
