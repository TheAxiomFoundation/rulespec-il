# Companion fixtures for the composed monthly-net pipeline.
#
# WHAT YEAR THIS SPEAKS FOR. The Israel corpus holds ONE expression of each provision —
# the Income Tax Ordinance as of 2026-06-08 and the National Insurance Law as of
# 2026-06-15 — so the ITO §121 bands encoded here are the post-amendment-288 text that
# takes effect on 1 January 2026: 84,120 / 120,720 / 228,000 / 301,200 / 560,280. These
# fixtures are evaluated in 2026 for that reason. This repository cannot compute a 2025
# liability, and the OECD TaxBEN Israel 2025 table is therefore not a like-for-like
# comparison in the middle of the schedule. See docs/ENCODING-GAPS.md,
# `corpus-holds-one-expression-per-provision`.
#
# SUPPLIED VALUES AND THEIR PROVENANCE — none of these is law as stated here:
#   credit_point_value_for_tax_year_ils = 2,904. From the OECD TaxBEN Israel 2025
#     description, a REFERENCE and not a source of law. ITO §120ב(ה)(1) freezes the
#     indexed amounts for tax years 2025 to 2027 at their 1 January 2024 level, and that
#     freeze IS encoded, so the same figure stands for 2026. The statute's own nominal
#     figure — 504 ILS, ITO §33א — is encoded in this repository as
#     `tax_credit_point_amount`.
#   current_basic_amount_first_and_fifth_plus_ils = 173 and
#   current_basic_amount_second_third_fourth_ils = 219. From the National Insurance
#     Institute's published rate table, effective 01.01.2026, read during this pilot.
#     That table is NOT carried in this repository: a policy capture is not
#     encoder-generated content. The statute's own nominal figures — 150 and 188, NII
#     §1(2)(א) and (ב) — ARE encoded, are imported by this pipeline, and every case
#     asserts `statutory_nominal_monthly_child_allowance_ils` next to the amount actually
#     paid so the distance between them is visible.
#
# THE §121ב THRESHOLD IS NOT SUPPLIED. This pipeline applies the 640,000 ILS the section
# prints. The current-year threshold is higher, so the high-earner case below crosses a
# nominal line rather than the year's line. That is a narrower claim than an indexed
# figure would be, and it is the encoder's module that makes it: §121ב has no threshold
# input to override.
#
# THE COUPLING IS DERIVED. `taxable_income_for_section_121b` is derived here from the
# monthly wage; §121ב computes the additional tax from it; and the fact NII §66 excludes
# on — `insured_parent_has_income_subject_to_additional_tax_under_section_121b` — is
# derived from that tax being positive. No fixture sets it. Raise the wage past the
# threshold and the child allowance goes to zero because of NII §66's own encoded
# judgment.
#
# READ docs/ENCODING-GAPS.md BEFORE PRESENTING THE HIGH-EARNER CASE. The OECD TaxBEN
# Israel description says this benefit "is not means-tested", which cannot be reconciled
# with §66's exclusion. Nothing captured resolves it. This fixture demonstrates the
# encoded provision; it is NOT a verified description of what the National Insurance
# Institute pays.

- name: working_mother_two_children_aged_two_and_eight_fifteen_thousand_a_month
  # The base case. 180,000 a year on the §121(ב)(1) reduced schedule is
  # 10% x 84,120 + 14% x 36,600 + 20% x 59,280 = 25,392. The mother's credit points are
  # §34's two, §36's quarter, §36א's half, and the §66(ג)(4)(א) ladder's 4.5 for a child
  # between the year after birth and the year it turns two plus 2 for a child from the year
  # it turns six — 9.25 points, 26,862 ILS, which exceeds the tax. Net is the wage plus the
  # child allowance.
  period:
    period_kind: month
    start: '2026-01-01'
    end: '2026-12-31'
  input:
    il:statutes/composed/worker-with-children-monthly-net-pipeline#input.monthly_gross_wage_ils: 15000
    il:statutes/composed/worker-with-children-monthly-net-pipeline#input.number_of_children: 2
    il:statutes/composed/worker-with-children-monthly-net-pipeline#input.taxpayer_is_a_woman: true
