
# Companion fixtures for the composed monthly-net capstone.
#
# SUPPLIED VALUES AND THEIR PROVENANCE — none of these is law as stated here.
# Every one of them now traces to a publication by the body that administers the
# instrument, EXCEPT the last, which is flagged as such.
#
#   THE CREDIT-POINT VALUE IS NO LONGER SUPPLIED AT ALL. It is imported from
#     il/policies/israel-tax-authority/adjusted-amounts, which carries the Tax
#     Authority's own booklet: 242 לחודש in both the 2025 and the 2026 edition,
#     x12 = 2,904. The two editions agreeing IS the §120ב(ה)(1) freeze, shown by
#     the publisher rather than asserted here.
#   additional_tax_threshold_for_tax_year_ils = 721,560 — the Tax Authority's
#     booklet, "יחיד אשר הכנסתו החייבת בשנת המס עלתה על ₪ 721,560", stated
#     identically for 2025 and 2026. Still supplied here only because it is an
#     input of an IMPORTED module (§121ב) and the capstone cannot feed those.
#   thirty_five_percent_band_upper_ils = 560,280 — likewise the Tax Authority's
#     booklet for both years. This one matters: the captured 2025 expression of
#     §121(א)(2) is internally defective, so the publisher's booklet is the only
#     source here that states that boundary for 2025 without the defect.
#   child allowance 169 / 214 for 2025 and 173 / 219 for 2026 — BOTH from
#     captured official ביטוח לאומי publications (the 2025 figures from the
#     Institute's own page as it stood 2025-04-20, retrieved via the Internet
#     Archive; the 2026 figures from the live page).
#   current_basic_amount_* on the §68 module — THE ONE REMAINING WEAK NUMBER.
#     §1 states 150/188/140 nominal and no official basic amount has been
#     captured for either year. See docs/ENCODING-GAPS.md.
#
# CONSISTENCY THE FIXTURE MUST MAINTAIN: annual_taxable_income_ils is supplied to
# the imported §121 module and equals monthly_gross_wage_ils x 12 in every case.
#
# `section-66#input.parent_has_income_liable_to_additional_tax` is assigned in every
# case because the harness requires every input of every module in the graph, but
# the capstone NO LONGER READS IT. The §121ב exclusion is derived once, from the
# imported `liable_to_additional_tax` judgment, and §66 contributes only its
# insurance limb. `stale_nii_surtax_flag_no_longer_changes_the_allowance_2025` is
# the regression test: it is the first fixture with that flag flipped to TRUE, and
# it must produce exactly the same allowance and the same net.
# The pipeline cannot compute it, because an imported module's inputs are
# supplied, not derived — the same constraint the rulespec-dk capstone documents.
#
# ON THE IMPORTED §66 ASSERTIONS: `mother_child_credit_points` and
# `father_child_credit_points` belong to the §66 module and are a property of the
# §66 inputs supplied here (child_age_years and the two year flags), NOT of
# number_of_children. In the no-children case those inputs still describe a
# hypothetical child, so the imported rules return that child's points while the
# capstone's own child_1_credit_points and child_2_credit_points correctly return
# 0. The composed total uses the capstone's rules.
#
# The last case is the point of the whole pilot: raise the wage past the §121ב
# threshold and the child allowance goes to zero, because NII §66 excludes a
# parent liable to that tax. Nothing models that — the captured statutory text
# says it.
#
# BUT READ docs/ENCODING-GAPS.md FIRST. The OECD TaxBEN Israel description says
# this benefit "is not means-tested", which cannot be reconciled with §66's
# exclusion, and nothing captured resolves the conflict. This fixture shows what
# the encoded statute says. It is NOT a verified statement of what the National
# Insurance Institute actually pays a high earner, and must not be shown as one.

