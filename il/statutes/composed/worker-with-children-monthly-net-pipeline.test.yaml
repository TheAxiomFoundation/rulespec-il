- name: working_mother_child_turning_three_this_year_and_child_aged_eight
  # The two ages diverge around a birthday. The younger child is two at the allowance month
  # but turns three later in the tax year: ITO §66(ג)(4)(א) reads the age ATTAINED in the tax
  # year, so it draws the year-turning-three points — 3.5 for a mother — not the 4.5 of the
  # year after birth through age two, while NII §65(א) reads the age at the month and still
  # counts it. Points 2 + 0.25 + 0.5 + 3.5 + 2 = 8.25; 8.25 x 2,904 = 23,958, against 25,392 of
  # tax, leaving 1,434 for the year, 119.5 a month. Allowance 173 + 219 = 392 (338 nominal).
